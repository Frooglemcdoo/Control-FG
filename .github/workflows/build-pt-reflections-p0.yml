name: Build PT reflections P0

on:
  push:
    branches:
      - experiment/pt-reflections-p0
      - experiment/pt-verify-stages-20261010
      - experiment/pt-local-light-probe-p1
      - experiment/pt-local-light-record-audit
      - experiment/pt-local-light-gates-p1
      - experiment/pt-local-light-hit-validation-p1
      - experiment/pt-secondary-normal-proof-v7
      - experiment/pt-two-layer-bounce-proof
      - experiment/pt-secondary-origin-precision
      - experiment/pt-secondary-material-filter
      - experiment/pt-hit-uav-coherence
      - experiment/pt-hit-rejection-diagnostic
      - experiment/pt-material-buffer-bounds
      - experiment/pt-overlay-toggle
      - experiment/pt-native-secondary-shading
      - experiment/pt-bounce-energy
      - experiment/pt-preserve-diffuse
      - experiment/pt-sharper-materials
      - experiment/pt-glass-capture
      - experiment/pt-glass-integration
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate profiling collector early
        shell: powershell
        run: tools/test-pt-profile.ps1
      - name: Check settings-preserving PT enable script
        shell: powershell
        run: ./tools/test-pt-enable.ps1

      - name: Test native DXR call routing
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%I"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist build mkdir build
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-startup-settings.cpp /Febuild\test-pt-startup-settings.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-startup-settings.exe off
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-startup-settings.exe on
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-scaling-metrics.cpp /Febuild\test-pt-scaling-metrics.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-scaling-metrics.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-glass-vtable-call.cpp /Febuild\test-glass-call.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-glass-call.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-reflection-energy.cpp /Febuild\test-reflection-energy.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-reflection-energy.exe
          if not "%errorlevel%"=="0" exit /b 1
      - name: Test native geometry observation M6
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%I"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-scene-observer.cpp /Febuild\test-pt-scene-observer.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-scene-observer.exe
          if not "%errorlevel%"=="0" exit /b 1

      - name: Validate composition container checksum against Windows compiler
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%I"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-dxbc-checksum.cpp /Febuild\test-pt-dxbc-checksum.exe /link d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-dxbc-checksum.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-surface-composition.cpp /Febuild\test-pt-surface-composition.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-surface-table-budget.cpp /Febuild\test-pt-surface-table-budget.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-surface-table-budget.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-primary-readiness.cpp /Febuild\test-pt-primary-readiness.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-primary-readiness.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-native-view.cpp /Febuild\test-pt-native-view.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-native-view.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-native-root-layout.cpp /Febuild\test-pt-native-root-layout.exe /link d3d12.lib dxgi.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-native-root-layout.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-command-bindings.cpp /Febuild\test-pt-command-bindings.exe /link d3d12.lib dxgi.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-command-bindings.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-table-mirror.cpp /Febuild\test-pt-table-mirror.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-table-mirror.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-surface-output.cpp /Febuild\test-pt-surface-output.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-surface-output.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-upload-pool.cpp /Febuild\test-pt-upload-pool.exe /link d3d12.lib dxgi.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-upload-pool.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-primary-commit.cpp /Febuild\test-pt-primary-commit.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-primary-commit.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-surface-history.cpp /Febuild\test-pt-surface-history.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-surface-history.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-emissive-termination.cpp /Febuild\test-pt-emissive-termination.exe /link d3d11.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-emissive-termination.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-miss-gi.cpp /Febuild\test-pt-miss-gi.exe /link d3d11.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-miss-gi.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-native-light-roughness.cpp /Febuild\test-pt-native-light-roughness.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-native-light-roughness.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-light-reservoir.cpp /Febuild\test-pt-light-reservoir.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-light-reservoir.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-material-history.cpp /Febuild\test-pt-material-history.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-material-history.exe
          if not "%errorlevel%"=="0" exit /b 1
          set PT_SURFACE_TEST_FAILED=0
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-surface-root-buffer.cpp /Febuild\test-pt-surface-root-buffer.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-surface-root-buffer.exe
          if not "%errorlevel%"=="0" set PT_SURFACE_TEST_FAILED=1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-surface-reconstruction.cpp /Febuild\test-pt-surface-reconstruction.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-surface-reconstruction.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-surface-reconstruction.exe split
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-surface-reconstruction.exe split fresh
          if not "%errorlevel%"=="0" set PT_SURFACE_TEST_FAILED=1
          if not "%PT_SURFACE_TEST_FAILED%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-rr-pt-guides.cpp /Febuild\test-rr-pt-guides.exe /link d3d11.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\test-rr-pt-guides.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-terminal-gi.cpp /Febuild\test-pt-terminal-gi.exe /link d3d11.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-terminal-gi.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-terminal-gi-compute.cpp /Febuild\test-pt-terminal-gi-compute.exe /link d3d11.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-terminal-gi-compute.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-callable-table.cpp /Febuild\test-pt-callable-table.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-callable-table.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-primary-lights.cpp /Febuild\test-pt-primary-lights.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-primary-lights.exe
          if not "%errorlevel%"=="0" exit /b 1

      - name: Test integrated primary results collector
        shell: powershell
        run: tools/test-pt-primary-collector.ps1

      - name: Test M6 results collector
        shell: powershell
        run: tools/test-pt-scene-collector.ps1

      - name: Test M7 binding decoder and collector
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%I"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-native-binding.cpp /Febuild\test-pt-native-binding.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-native-binding.exe
          if not "%errorlevel%"=="0" exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/test-pt-scene-binding-collector.ps1
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-owned-scene.cpp /Febuild\test-pt-owned-scene.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-owned-scene.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-scene-topology.cpp /Febuild\test-pt-scene-topology.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-scene-topology.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-scene-dispatch-plan.cpp /Febuild\test-pt-scene-dispatch-plan.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-scene-dispatch-plan.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-native-job-route.cpp /Febuild\test-pt-native-job-route.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-native-job-route.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-native-job-runtime.cpp /Febuild\test-pt-native-job-runtime.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-native-job-runtime.exe
          if not "%errorlevel%"=="0" exit /b 1
          python tools/test-pt-scene-correlation.py
          if not "%errorlevel%"=="0" exit /b 1

      - name: Verify glossy-only removal and native fallback
        run: python tools/test-pt-glass-glossy-only.py
      - name: Verify glass installation compatibility gate
        run: python tools/test-pt-glass-install.py

      - name: Configure MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%I"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          echo VSROOT=%VSROOT%>>%GITHUB_ENV%

      - name: Prepare Streamline and generated shaders
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist build mkdir build
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Fetch-Streamline.ps1
          if not "%errorlevel%"=="0" exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Verify-Streamline.ps1
          if not "%errorlevel%"=="0" exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Verify-RRRuntime.ps1
          if not "%errorlevel%"=="0" exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Patch-OverlayStability.ps1
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-distance.cpp /Fobuild\compile-distance.obj /Febuild\compile-distance.exe /link d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\compile-distance.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-live.cpp /Fobuild\compile-live.obj /Febuild\compile-live.exe /link d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\compile-live.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-skin-mask.cpp /Fobuild\compile-skin-mask.obj /Febuild\compile-skin-mask.exe /link d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\compile-skin-mask.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-reflectance.cpp /Fobuild\compile-reflectance.obj /Febuild\compile-reflectance.exe /link d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\compile-reflectance.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-fg-ui-alpha.cpp /Fobuild\compile-fg-ui-alpha.obj /Febuild\compile-fg-ui-alpha.exe /link d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\compile-fg-ui-alpha.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-clamp-strength.cpp /Fobuild\compile-clamp-strength.obj /Febuild\compile-clamp-strength.exe /link d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          for /l %%S in (25,1,75) do build\compile-clamp-strength.exe %%S
          if not "%errorlevel%"=="0" exit /b 1
          copy /y src\rr_clamp_variants.in.h build\rr_clamp_variants.h >nul
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-pt-reflection-p2-composite.cpp /Fobuild\compile-pt-reflection-p2-composite.obj /Febuild\compile-pt-reflection-p2-composite.exe /link d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\compile-pt-reflection-p2-composite.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-pt-reflection-p2-diffuse-bridge.cpp /Fobuild\compile-pt-reflection-p2-diffuse-bridge.obj /Febuild\compile-pt-reflection-p2-diffuse-bridge.exe /link d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\compile-pt-reflection-p2-diffuse-bridge.exe
          if not "%errorlevel%"=="0" exit /b 1
          pushd src
          rc /nologo /fo ..\build\control_fg_logo.res control_fg_logo.rc
          set "RC_RESULT=%ERRORLEVEL%"
          popd
          if not "%RC_RESULT%"=="0" exit /b %RC_RESULT%

      - name: Check glass capture parser
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-glass-capture.cpp /Febuild\test-pt-glass-capture.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-glass-capture.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-primary-pipeline-probe.cpp /Febuild\test-pt-primary-pipeline-probe.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-primary-pipeline-probe.exe
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-primary-profiles.cpp /Febuild\test-pt-primary-profiles.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-primary-profiles.exe
          if not "%errorlevel%"=="0" exit /b 1
          python tools/test-pt-primary-variants.py
          if not "%errorlevel%"=="0" exit /b 1

      - name: Test scene version queue ordering
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-scene-order.cpp /Febuild\test-pt-scene-order.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-scene-order.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-scene-catalog.cpp /Febuild\test-pt-scene-catalog.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-scene-catalog.exe
          if not "%errorlevel%"=="0" exit /b 1

      - name: Test exact AS descriptor copies
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-descriptor-interest.cpp /Febuild\test-pt-descriptor-interest.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-descriptor-interest.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-scene-descriptors.cpp /Febuild\test-pt-scene-descriptors.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-scene-descriptors.exe
          if not "%errorlevel%"=="0" exit /b 1

      - name: Test exported descriptor submission order
        run: python -m unittest discover -s research/pt-reflections/tools -p test_replay_descriptor_events.py

      - name: Test M11 retained native resource ownership on WARP
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-resource-lease.cpp /Febuild\test-pt-resource-lease.exe /link d3d12.lib dxgi.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-resource-lease.exe
          if not "%errorlevel%"=="0" exit /b 1

      - name: Check production compute capture path
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-glass-pipeline-capture.cpp /Febuild\test-pt-glass-pipeline-capture.exe /link bcrypt.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-glass-pipeline-capture.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-glass-pipeline-capture.exe --enabled
          if not "%errorlevel%"=="0" exit /b 1

      - name: Check glass collector retains middle records
        shell: powershell
        run: tools/test-pt-glass-collector.ps1

      - name: Check specular energy and diffuse preservation
        run: python tools/test-pt-specular-preservation.py

      - name: Check native primary reflection fidelity
        run: python tools/test-pt-primary-native.py

      - name: Check secondary material encoding
        run: python tools/test-pt-secondary-encoding.py

      - name: Check secondary ray origin precision
        run: python tools/test-pt-secondary-origin.py

      - name: Audit native PT reflection contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python tools/audit-pt-reflection-native.py build/pt-reflection-native-audit.json
          if($LASTEXITCODE -ne 0){throw "Native reflection audit failed: $LASTEXITCODE"}
      - name: Compile PT reflection DXIL libraries
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $pf86=[Environment]::GetFolderPath('ProgramFilesX86')
          $pf=[Environment]::GetFolderPath('ProgramFiles')
          $roots=@(
            (Join-Path $pf86 'Windows Kits\10\bin'),
            (Join-Path $pf 'Microsoft Visual Studio'),
            (Join-Path $pf86 'Microsoft Visual Studio')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          $dxc=$null
          foreach($root in $roots){
            $candidate=Get-ChildItem -LiteralPath $root -Filter dxc.exe -File -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if($candidate){$dxc=$candidate.FullName;break}
          }
          if(-not $dxc){throw 'dxc.exe was not found in the Windows SDK / Visual Studio installation.'}
          Write-Host "DXC: $dxc"
          # Exercise the shared production transport with the production compiler.
          & $dxc -T cs_6_0 -E main -HV 2021 -O3 -WX -I src/shaders -Fo build/test-pt-surface-commit.dxil tools/test-pt-surface-commit.hlsl
          if($LASTEXITCODE -ne 0){throw "Surface transport fixture DXC failed: $LASTEXITCODE"}
          & build/test-pt-primary-commit.exe surface
          if($LASTEXITCODE -ne 0){throw "Surface transport GPU readback failed: $LASTEXITCODE"}
          & $dxc -T lib_6_3 -HV 2021 -O3 -WX -I src/shaders -Fo build/pt_primary_path.dxil src/shaders/pt_primary_path.hlsl
          if($LASTEXITCODE -ne 0){throw "Primary path DXC compile failed: $LASTEXITCODE"}
          # Distinct filenames prevent loading a replacement shader with the legacy host contract.
          & $dxc -T lib_6_3 -HV 2021 -O3 -WX -I src/shaders -Fo build/pt_primary_surface.dxil src/shaders/pt_primary_surface.hlsl
          if($LASTEXITCODE -ne 0){throw "Surface replacement DXC compile failed: $LASTEXITCODE"}
          & $dxc -dumpbin build/pt_primary_surface.dxil | Set-Content build/pt_primary_surface.dump.txt -Encoding UTF8
          if($LASTEXITCODE -ne 0){throw "Primary callable DXIL inspection failed: $LASTEXITCODE"}
          $surfaceDump=Get-Content build/pt_primary_surface.dump.txt -Raw
          # Raygen may read volume transforms/weights for coverage only. Brick
          # traversal, texture sampling and callable dispatch remain compute-only.
          foreach($forbidden in @('PTTerminalGICallable','dx.op.callShader','PTGIBricks','PTGITopNodes','PTGIInternalNodes')){
            if($surfaceDump.Contains($forbidden)){throw "GI code leaked into DXR: $forbidden"}
          }
          foreach($required in @('PTGIRequestGeometry','PTGIRequestWeight','PTGIVolumes','PTGITop')){
            if(-not $surfaceDump.Contains($required)){throw "GI request contract missing: $required"}
          }
          & $dxc -T cs_6_0 -E main -HV 2021 -O3 -WX -I src/shaders -Fo build/pt_terminal_gi_compute.dxil src/shaders/pt_terminal_gi_compute.hlsl
          if($LASTEXITCODE -ne 0){throw "Terminal GI compute compile failed: $LASTEXITCODE"}
          & $dxc -T cs_6_0 -E main -HV 2021 -O3 -WX -I src/shaders -Fo build/pt_surface_reconstruct.dxil src/shaders/pt_surface_reconstruct.hlsl
          if($LASTEXITCODE -ne 0){throw "Surface reconstruction DXC compile failed: $LASTEXITCODE"}
          & $dxc -T lib_6_3 -HV 2021 -O3 -I src/shaders -Fo build/pt_glass_raygen.dxil src/shaders/pt_glass_raygen.hlsl
          if($LASTEXITCODE -ne 0){throw "Glass DXC compile failed: $LASTEXITCODE"}
          & $dxc -T lib_6_3 -HV 2021 -O3 -I src/shaders -Fo build/pt_reflection_p2.dxil src/shaders/pt_reflection_p2.hlsl
          if($LASTEXITCODE -ne 0){throw "DXC compile failed: $LASTEXITCODE"}
          & $dxc -dumpbin build/pt_reflection_p2.dxil | Set-Content -LiteralPath build/pt_reflection_p2.dump.txt -Encoding UTF8
          if($LASTEXITCODE -ne 0){throw "DXC dump failed: $LASTEXITCODE"}
          $dump=Get-Content -LiteralPath build/pt_reflection_p2.dump.txt -Raw
          if(([regex]::Matches($dump,'call void @dx.op.barrier\(i32 80, i32 2\)')).Count -lt 3){
            throw 'P2 DXIL is missing device-wide UAV memory barriers.'
          }

          foreach($name in @(
            'reflectionRayGeneration',
            'reflectionClosestHit',
            'reflectionAlphaTestAnyHit',
            'reflectionMiss',
            'shadowClosestHit',
            'shadowAlphaTestAnyHit',
            'shadowMiss'
          )){
            if(-not $dump.Contains($name)){throw "Missing DXR export: $name"}
          }
          $source=Get-Content -LiteralPath src/shaders/pt_reflection_p2.hlsl -Raw
          foreach($contract in @(
            'g_rwtShadow : register(u3)',
            'g_rwtShadow[uint3(pixel,layer)]=0u',
            'g_rwtShadow[uint3(pixel,layer)]=1u'
          )){
            if(-not $source.Contains($contract)){throw "Missing native shadow contract: $contract"}
          }
          if(-not $source.Contains('#define PT_REFLECTION_P2_POST_COMPOSITE_READY 1')){
            throw 'P2 paired-layer post-composite marker missing.'
          }
          (Get-FileHash -LiteralPath build/pt_reflection_p2.dxil -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath build/pt_reflection_p2.sha256 -Encoding ASCII

          & $dxc -T lib_6_3 -HV 2021 -O3 -I src/shaders -Fo build/pt_reflection_p1.dxil src/shaders/pt_reflection_p1.hlsl
          if($LASTEXITCODE -ne 0){throw "P1 DXC compile failed: $LASTEXITCODE"}
          & $dxc -dumpbin build/pt_reflection_p1.dxil | Set-Content -LiteralPath build/pt_reflection_p1.dump.txt -Encoding UTF8
          if($LASTEXITCODE -ne 0){throw "P1 DXC dump failed: $LASTEXITCODE"}
          $p1dump=Get-Content -LiteralPath build/pt_reflection_p1.dump.txt -Raw
          foreach($name in @(
            'reflectionRayGeneration',
            'reflectionClosestHit',
            'reflectionAlphaTestAnyHit',
            'reflectionMiss',
            'shadowClosestHit',
            'shadowAlphaTestAnyHit',
            'shadowMiss'
          )){
            if(-not $p1dump.Contains($name)){throw "P1 missing DXR export: $name"}
          }
          $p1source=Get-Content -LiteralPath src/shaders/pt_reflection_p1.hlsl -Raw
          if(-not $p1source.Contains('#define PT_REFLECTION_P1_STOCK_COMPOSITE_COMPATIBLE 1')){
            throw 'P1 stock-composite compatibility marker missing.'
          }
          (Get-FileHash -LiteralPath build/pt_reflection_p1.dxil -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath build/pt_reflection_p1.sha256 -Encoding ASCII
      - name: Compile glass lighting and validate native root on WARP
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\compile-pt-glass-lighting.cpp /Febuild\compile-pt-glass-lighting.exe /link d3dcompiler.lib d3d12.lib dxgi.lib
          if not "%errorlevel%"=="0" exit /b 1
          build\compile-pt-glass-lighting.exe
          if not "%errorlevel%"=="0" exit /b 1

      - name: Validate profiling stages and capture script syntax
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-hotpath-timing.cpp /Febuild\test-pt-hotpath-timing.exe
          if not "%errorlevel%"=="0" exit /b 1
          build\test-pt-hotpath-timing.exe
          if not "%errorlevel%"=="0" exit /b 1

      - name: Compile experimental proxy
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          rem Compile both host contracts; ship root-buffer PT plus reconstruction.
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT /c /DCONTROL_PT_RECOVERY_BUILD /DUNICODE /D_UNICODE /I "third_party\streamline\include" src\probe.cpp /Fobuild\probe-legacy.obj
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT /LD /DCONTROL_PT_SURFACE_REPLACEMENT /Zi /Fd"build\probe.pdb" /guard:cf /DUNICODE /D_UNICODE /I "third_party\streamline\include" src\probe.cpp build\control_fg_logo.res /Fobuild\probe.obj /Febuild\dxgi.dll /link /DEF:src\dxgi.def /INCREMENTAL:NO /DEBUG:FULL /OPT:REF /OPT:ICF /PDB:"build\dxgi.pdb" /DYNAMICBASE /NXCOMPAT /GUARD:CF bcrypt.lib wintrust.lib user32.lib gdi32.lib msimg32.lib d3d12.lib
          if not "%errorlevel%"=="0" exit /b 1
          dumpbin /exports build\dxgi.dll > build\exports.txt
          dumpbin /imports build\dxgi.dll > build\imports.txt

      - name: Package reconstructed primary PT M12R101
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out='Control-FG-PT-Primary-M12R101'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/dxgi.dll "$out/dxgi.dll"
          Copy-Item build/dxgi.pdb "$out/dxgi.pdb"
          Copy-Item tools/PT-Profile.cmd,tools/PT-Profile.ps1 $out
          Copy-Item tools/PT-Capture-Baseline.cmd,tools/PT-Capture-Restore.cmd,tools/PT-Enable.cmd,tools/PT-Enable.ps1,tools/RT-Only.cmd $out
          $shaders=@('pt_surface_reconstruct.dxil','pt_primary_surface.dxil','pt_terminal_gi_compute.dxil','pt_primary_path.dxil','pt_reflection_p1.dxil','pt_reflection_p2.dxil',
            'pt_reflection_p2_composite.dxbc','pt_reflection_p2_verify.dxbc',
            'pt_reflection_p2_local_light_probe.dxbc','pt_reflection_p2_diffuse_bridge.dxbc',
            'pt_glass_raygen.dxil','pt_glass_secondary.dxbc','pt_glass_composite.dxbc')
          foreach($shader in $shaders){Copy-Item "build/$shader" $out}
          Copy-Item tools/Collect-PT-Primary-M12R101.cmd,tools/Collect-PT-Primary-M12R101.ps1 $out
          Copy-Item research/pt-reflections/PT-Primary-M12R101-README.txt "$out/README.txt"
          @{Build='M12R101';Commit=$env:GITHUB_SHA;Run=$env:GITHUB_RUN_ID;Lighting='PT surface replacement with spatial-temporal reconstruction';SurfaceReplacementEnabled=$true;SurfaceBinding='root_buffer';GlobalSamplerReplay='explicit_same_root_and_continuously_bound_sampler_heap';SecondaryShadingNormal='oriented_interpolated_mesh_with_geometric_fallback';ReflectionHemisphere='geometric_direct_and_continuation';Reconstruction='fresh_current_frame_for_selected_rr_otherwise_split_temporal_spatial';PTDiffuseGuidesEnabled=$true;DirectLightTarget='material_brdf_radiance';DirectLightLobe='native_radius_broadening';PrimaryLightCandidates='enumerate_up_to_64';FlickerResolved=$false;SecondaryMaterialAdmission='native_unified_flags_primary_gate_separate';MissGI='native_extent_endpoint_cache_with_environment_fallback';SecondaryDiffuseTail='authored_cache_at_covered_hit_with_probability_compensated_specular_continuation';DiffuseReconstructionFactor='unit_color_matches_primary_transport';FallbackDiagnostics='binding_origin_shader_and_material_screen_regions';PTSpecularGuideAngle='primary_n_dot_v';SurfaceFallbackDiagnostics=$true;PendingSurfaceCamera=$true;FoliageVertexCamera=$true;SecondaryEmissionBeforeBRDFRejection=$true;PrimaryLobeProposal='balanced_energy_preserving';EarlySurfaceReservation=$true;NativePrimaryMaterialColor=$true;TerminalDiffuseVolumeCache=$true;TerminalGIExecution='compute_after_trace_reusing_reconstruction_buffers';PipelineCreationDiagnostics=$true;ConsumerIsolationEnabled=$true;ObjectMotionSupported=$false;PrimaryCorrespondenceFixed=$false;MissingLightingFixed=$false;NativePassesRetained=$true;PerformanceRedesignComplete=$false;Validation='Windows build and WARP; in-game test pending'} |
            ConvertTo-Json | Set-Content "$out/Build.json" -Encoding UTF8
          Get-ChildItem -LiteralPath $out -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$_.Name
          } | Set-Content "$out/SHA256SUMS.txt" -Encoding ASCII
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force
          (Get-FileHash "$out.zip" -Algorithm SHA256).Hash | Set-Content "$out.sha256" -Encoding ASCII

