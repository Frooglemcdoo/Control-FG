name: Build native reflection enhancements and RR

on:
  push:
    branches:
      - experiment/pt-reflections-p0
      - experiment/pt-verify-stages-20261010
      - experiment/pt-local-light-probe-p1
      - experiment/pt-local-light-record-audit
      - experiment/pt-local-light-gates-p1
      - experiment/pt-local-light-hit-validation-p1
      - experiment/pt-secondary-normal-proof-v7
      - experiment/pt-two-layer-bounce-proof
      - experiment/pt-secondary-origin-precision
      - experiment/pt-secondary-material-filter
      - experiment/pt-hit-uav-coherence
      - experiment/pt-hit-rejection-diagnostic
      - experiment/pt-material-buffer-bounds
      - experiment/pt-overlay-toggle
      - experiment/pt-native-secondary-shading
      - experiment/pt-bounce-energy
      - experiment/rr-clean-baseline-r21
      - experiment/rr-gi-capture-r28
      - experiment/rr-gi-samples-r29
      - experiment/rr-gi-samples-r30
      - experiment/rr-gi-live-samples-r31
      - experiment/rr-dlaa-profile-r32
      - experiment/rr-gi-selection-fix-r33
      - experiment/glass-only-restore-r34
      - experiment/native-reflection-continuation-r35
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%I"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          echo VSROOT=%VSROOT%>>%GITHUB_ENV%

      - name: Prepare Streamline and generated shaders
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist build mkdir build
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Fetch-Streamline.ps1
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Verify-Streamline.ps1
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Verify-RRRuntime.ps1
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Patch-OverlayStability.ps1
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-distance.cpp /Fobuild\compile-distance.obj /Febuild\compile-distance.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-distance.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-live.cpp /Fobuild\compile-live.obj /Febuild\compile-live.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-live.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-rr-hair-opacity.cpp /Fobuild\compile-rr-hair-opacity.obj /Febuild\compile-rr-hair-opacity.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-rr-hair-opacity.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-rr-character-base-albedo.cpp /Fobuild\compile-rr-character-base-albedo.obj /Febuild\compile-rr-character-base-albedo.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-rr-character-base-albedo.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-skin-mask.cpp /Fobuild\compile-skin-mask.obj /Febuild\compile-skin-mask.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-skin-mask.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-reflectance.cpp /Fobuild\compile-reflectance.obj /Febuild\compile-reflectance.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-reflectance.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-fg-ui-alpha.cpp /Fobuild\compile-fg-ui-alpha.obj /Febuild\compile-fg-ui-alpha.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-fg-ui-alpha.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-clamp-strength.cpp /Fobuild\compile-clamp-strength.obj /Febuild\compile-clamp-strength.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          for /l %%S in (25,1,75) do build\compile-clamp-strength.exe %%S
          if errorlevel 1 exit /b 1
          copy /y src\rr_clamp_variants.in.h build\rr_clamp_variants.h >nul
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-pt-reflection-p2-composite.cpp /Fobuild\compile-pt-reflection-p2-composite.obj /Febuild\compile-pt-reflection-p2-composite.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-pt-reflection-p2-composite.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-pt-reflection-p2-diffuse-bridge.cpp /Fobuild\compile-pt-reflection-p2-diffuse-bridge.obj /Febuild\compile-pt-reflection-p2-diffuse-bridge.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-pt-reflection-p2-diffuse-bridge.exe
          if errorlevel 1 exit /b 1
          pushd src
          rc /nologo /fo ..\build\control_fg_logo.res control_fg_logo.rc
          set "RC_RESULT=%ERRORLEVEL%"
          popd
          if not "%RC_RESULT%"=="0" exit /b %RC_RESULT%

      - name: Check secondary ray origin precision
        run: python tools/test-pt-secondary-origin.py

      - name: Audit native PT reflection contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python tools/audit-pt-reflection-native.py build/pt-reflection-native-audit.json
          if($LASTEXITCODE -ne 0){throw "Native reflection audit failed: $LASTEXITCODE"}
      - name: Compile PT reflection DXIL libraries
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $pf86=[Environment]::GetFolderPath('ProgramFilesX86')
          $pf=[Environment]::GetFolderPath('ProgramFiles')
          $roots=@(
            (Join-Path $pf86 'Windows Kits\10\bin'),
            (Join-Path $pf 'Microsoft Visual Studio'),
            (Join-Path $pf86 'Microsoft Visual Studio')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          $dxc=$null
          foreach($root in $roots){
            $candidate=Get-ChildItem -LiteralPath $root -Filter dxc.exe -File -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if($candidate){$dxc=$candidate.FullName;break}
          }
          if(-not $dxc){throw 'dxc.exe was not found in the Windows SDK / Visual Studio installation.'}
          Write-Host "DXC: $dxc"
          & $dxc -T lib_6_3 -HV 2021 -O3 -I src/shaders -Fo build/pt_glass_raygen.dxil src/shaders/pt_glass_raygen.hlsl
          if($LASTEXITCODE -ne 0){throw "Glass DXC compile failed: $LASTEXITCODE"}
          & $dxc -T lib_6_3 -HV 2021 -O3 -I src/shaders -Fo build/opaque_reflection_raygen.dxil src/shaders/opaque_reflection_raygen.hlsl
          if($LASTEXITCODE -ne 0){throw "Opaque DXC compile failed: $LASTEXITCODE"}

      - name: Validate glass lighting, descriptors and resource retirement on WARP
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          python tools/test-pt-glass-glossy-only.py
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\compile-pt-glass-lighting.cpp /Febuild\compile-glass.exe /link d3dcompiler.lib d3d12.lib dxgi.lib
          if errorlevel 1 exit /b 1
          build\compile-glass.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-glass-resources.cpp /Febuild\test-glass-resources.exe /link d3d12.lib dxgi.lib
          if errorlevel 1 exit /b 1
          build\test-glass-resources.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-glass-descriptors.cpp /Febuild\test-glass-descriptors.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\test-glass-descriptors.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-glass-vtable-call.cpp /Febuild\test-glass-call.exe
          if errorlevel 1 exit /b 1
          build\test-glass-call.exe
          if errorlevel 1 exit /b 1

      - name: Validate opaque continuation resources and native composite on WARP
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\compile-opaque-reflection.cpp /Febuild\compile-opaque.exe /link d3dcompiler.lib d3d12.lib dxgi.lib
          if errorlevel 1 exit /b 1
          build\compile-opaque.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-opaque-resources.cpp /Febuild\test-opaque-resources.exe /link d3d12.lib dxgi.lib
          if errorlevel 1 exit /b 1
          build\test-opaque-resources.exe
          if errorlevel 1 exit /b 1

      - name: Verify clean baseline and character guide scope
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-rr-gi-samples.cpp /Febuild\test-gi-samples.exe
          if errorlevel 1 exit /b 1
          build\test-gi-samples.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-rr-perf-r32.cpp /Febuild\test-perf-r32.exe
          if errorlevel 1 exit /b 1
          build\test-perf-r32.exe
          if errorlevel 1 exit /b 1
          python tools/test-clean-baseline.py
          if errorlevel 1 exit /b 1
          python tools/test-rr-character-shader-match.py
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-rr-character-albedo.cpp /Febuild\test-character.exe
          if errorlevel 1 exit /b 1
          build\test-character.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-rr-hair-normals-gpu.cpp /Febuild\test-hair.exe /link d3d11.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\test-hair.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-rr-input-native.cpp /Febuild\test-input-native.exe /link d3d12.lib dxgi.lib
          if errorlevel 1 exit /b 1
          build\test-input-native.exe
          if errorlevel 1 exit /b 1

      - name: Compile experimental proxy
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT /LD /guard:cf /DUNICODE /D_UNICODE /I "third_party\streamline\include" src\probe.cpp build\control_fg_logo.res /Fobuild\probe.obj /Febuild\dxgi.dll /link /DEF:src\dxgi.def /INCREMENTAL:NO /DYNAMICBASE /NXCOMPAT /GUARD:CF bcrypt.lib wintrust.lib user32.lib gdi32.lib msimg32.lib
          if errorlevel 1 exit /b 1
          dumpbin /exports build\dxgi.dll > build\exports.txt
          dumpbin /imports build\dxgi.dll > build\imports.txt

      - name: Package native reflection enhancements R35
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out='Control-FG-Reflection-Enhancements-R35'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/dxgi.dll "$out/dxgi.dll"
          Copy-Item build/opaque_reflection_raygen.dxil "$out/opaque_reflection_raygen.dxil"
          Copy-Item build/opaque_reflection_composite.dxbc "$out/opaque_reflection_composite.dxbc"
          Copy-Item build/pt_glass_raygen.dxil "$out/pt_glass_raygen.dxil"
          Copy-Item build/pt_glass_secondary.dxbc "$out/pt_glass_secondary.dxbc"
          Copy-Item build/pt_glass_composite.dxbc "$out/pt_glass_composite.dxbc"
          Copy-Item Collect-RR-Skin-Capture.cmd "$out/Collect-RR-Skin-Capture.cmd"
          Copy-Item Collect-RR-Skin-Capture.ps1 "$out/Collect-RR-Skin-Capture.ps1"
          Copy-Item Collect-RR-Blinds-Capture.cmd "$out/Collect-RR-Blinds-Capture.cmd"
          Copy-Item Collect-RR-Blinds-Capture.ps1 "$out/Collect-RR-Blinds-Capture.ps1"
          Copy-Item Collect-ControlFG-Compact-Logs.cmd "$out/Collect-ControlFG-Compact-Logs.cmd"
          Copy-Item Collect-ControlFG-Compact-Logs.ps1 "$out/Collect-ControlFG-Compact-Logs.ps1"
          @'
          CONTROL-FG REFLECTION ENHANCEMENTS R35
          Branch: experiment/native-reflection-continuation-r35

          Adds the glass-style glossy continuation to native opaque RT reflections.
          Preserves native primary roughness, ray samples, direct/diffuse/emission,
          sample averaging and miss fallback. The reflected hit must be glossy
          (smoothness >= 0.8), matching the glass enhancement. Additional hits use
          private storage; original hit textures are restored after each ray.
          The retired P1/P2 experiment remains disabled; old pt_reflection_* files
          are ignored. Glass sidecars and glass shading are unchanged from R34.

          Close Control. Copy dxgi.dll and all five shader files beside
          Control_DX12.exe. No separate INI needed. Keep the game's Ray Traced
          Reflections and Ray Traced Transparent Reflections enabled.
          F10 -> REFLECTION ENHANCEMENTS: GLASS and OPAQUE switch independently
          in real time. Preferences are saved automatically.

          Retains R33 diffuse GI sample buttons, R32 performance logging and R21
          character/hair shaders. Additional rays/lighting cost GPU time and VRAM;
          opaque hit storage uses 32 bytes per reflection pixel per native layer,
          per in-flight slot (up to three). Unsupported shapes/allocation failures
          fall back to native reflections. Steam renderer hash gate retained.

          Automated compilation, recovered native-root PSO, descriptor/resource
          retirement and baseline checks do not replace in-game visual validation.
          Use OPAQUE OFF to compare with the previous native opaque reflections.
          Use the compact log collector if the enhancement does not show.
          '@ | Set-Content "$out/README.txt" -Encoding ASCII
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force
          (Get-FileHash "$out.zip" -Algorithm SHA256).Hash | Set-Content "$out.sha256" -Encoding ASCII

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Control-FG-Reflection-Enhancements-R35
          path: |
            Control-FG-Reflection-Enhancements-R35.zip
            Control-FG-Reflection-Enhancements-R35.sha256
            build/exports.txt
            build/imports.txt
            build/opaque_reflection_raygen.dxil
            build/opaque_reflection_composite.dxbc
            build/pt_glass_raygen.dxil
            build/pt_glass_secondary.dxbc
            build/pt_glass_composite.dxbc
          if-no-files-found: warn
          retention-days: 7
