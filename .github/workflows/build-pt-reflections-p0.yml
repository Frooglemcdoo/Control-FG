      - name: Package standalone capture preflight R134
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out='Control-FG-Capture-Preflight-R134'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/Capture-Preflight.exe "$out/Capture-Preflight.exe"
          Copy-Item tools/Run-Capture-Preflight.cmd "$out/Run-Capture-Preflight.cmd"
          Copy-Item docs/capture-preflight-r134.md "$out/README.md"
          New-Item -ItemType Directory -Force -Path build/preflight-logs | Out-Null
          Copy-Item "$env:LOCALAPPDATA/Control-FG/Diagnostics/Capture-R134-*.log" build/preflight-logs
          Get-Content build/preflight-logs/*.log
          Compress-Archive -Path $out -DestinationPath "$out.zip" -Force
          (Get-FileHash "$out.zip" -Algorithm SHA256).Hash | Set-Content "$out.sha256" -Encoding ASCII

      - uses: actions/upload-artifact@v4
