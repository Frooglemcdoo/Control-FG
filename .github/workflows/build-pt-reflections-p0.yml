          Copy-Item Collect-Character-R39.ps1 "$out/Collect-Character-R39.ps1"
          Copy-Item Collect-RR-Skin-Capture.cmd "$out/Collect-RR-Skin-Capture.cmd"
          Copy-Item Collect-RR-Skin-Capture.ps1 "$out/Collect-RR-Skin-Capture.ps1"
          Copy-Item Collect-RR-Material-Capture.cmd,Collect-RR-Material-Capture.ps1 $out
          Copy-Item Collect-RR-Blinds-Capture.cmd "$out/Collect-RR-Blinds-Capture.cmd"
          Copy-Item Collect-RR-Blinds-Capture.ps1 "$out/Collect-RR-Blinds-Capture.ps1"
          Copy-Item Collect-ControlFG-Compact-Logs.cmd "$out/Collect-ControlFG-Compact-Logs.cmd"
          Copy-Item Collect-ControlFG-Compact-Logs.ps1 "$out/Collect-ControlFG-Compact-Logs.ps1"
          Copy-Item Package-Lighting-Capture.cmd,tools/package-lighting-capture.py,Package-Lighting-Performance.ps1 $out
          Copy-Item Capture-RR-Boundary.cmd,Capture-RR-Boundary.ps1,Collect-RR-Boundary-Status.cmd,tools/collect-rr-boundary.py $out
          Copy-Item Start-Compact-Distance-Test.cmd,Capture-RR-Suite.ps1,tools/collect-rr-suite.py $out
          Copy-Item tools/diagnostics/Start-CPU-R253-NativeGPUStorage-*.cmd $out
          Copy-Item tools/diagnostics/Collect-Texture-Trace.cmd,tools/diagnostics/Collect-Texture-Trace.ps1 $out
          Copy-Item build/DirectStorage "$out/DirectStorage" -Recurse
          Copy-Item build/DirectStorage/dstorage.dll,build/DirectStorage/dstoragecore.dll $out
          Copy-Item tools/directstorage/Validate-DirectStorage.cmd "$out/DirectStorage"
          Copy-Item docs/native-gpu-storage-r253.md "$out/DIAGNOSTIC-NOTES.md"
          @'
          CONTROL-FG R253 - Native wayfinding texture selection timing
          Copy package contents beside Control_DX12.exe, replacing previous mod files.
          Run Start-CPU-R253-NativeGPUStorage-4ms.cmd then press F6 before approaching a blurry painting or sign.
          Matching 8ms, 10ms and 12ms launchers also keep 16 partitions pinned.
          Newly allocated supported 2D texture loads use DirectStorage GPU buffers,
          GPU row repacking and GPU texture copy before native publication.
          R253 initializes both storage lanes on the worker after the first valid Present.
          Unsupported assets and requests rejected before admission remain native.
          Expect DIRECTSTORAGE_R253 installed=1 and increasing accepted/completed counters.
          Speculative CPU read-ahead and loader/completion diagnostic hooks are disabled.
          F6 records 30 seconds; wait at least 40 seconds then run Collect-Texture-Trace.cmd.
          Approach the affected asset and watch it sharpen. Note its location.
          No Reference or standalone validator run is required.
          '@ | Set-Content "$out/README.txt" -Encoding ASCII
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force
          (Get-FileHash "$out.zip" -Algorithm SHA256).Hash | Set-Content "$out.sha256" -Encoding ASCII

