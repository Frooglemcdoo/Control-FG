          $out='Control-FG-NativeGPUStorage-R253'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/dxgi.dll "$out/dxgi.dll"
          Copy-Item build/rt_spot_selected_off.dxbc,build/rt_spot_selection.dxbc,build/rt_spot_visibility.dxbc,build/rt_spot_light_ids.dxbc,build/rt_spot_raw_history.dxbc,build/rt_spot_raw_spatial0.dxbc,build/rt_spot_raw_spatial1.dxbc,build/rt_spot_full.dxil,build/rt_spot_r94.dxil,build/rt_spot_light.dxbc,build/rt_spot_reset.dxbc,build/rt_spot_history.dxbc,build/rt_spot_spatial0.dxbc,build/rt_spot_spatial1.dxbc $out
          New-Item -ItemType Directory -Force -Path "$out/ControlFGStreamline" | Out-Null
          Copy-Item build/ControlFG.RTX40MFG.dll "$out/ControlFGStreamline/ControlFG.RTX40MFG.dll"
          Copy-Item build/pt_glass_raygen.dxil "$out/pt_glass_raygen.dxil"
          Copy-Item build/pt_glass_secondary.dxbc "$out/pt_glass_secondary.dxbc"
          Copy-Item build/pt_glass_composite.dxbc "$out/pt_glass_composite.dxbc"
