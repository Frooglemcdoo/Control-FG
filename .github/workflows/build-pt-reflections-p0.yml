name: Build native reflection enhancements and RR

on:
  push:
    branches:
      - work/r253-sign-selection
      - work/r250-texture-publication-timing
      - work/r247-storage-prewarm
      - work/r245-native-gpu-storage
      - work/r240-native-texture-contract
      - work/r238-queue-order-completion
      - work/r237-early-archive-reads
      - work/r236-loader-stages
      - work/r235-upstream-loader-trace
      - work/r234-directstorage-demand-windows
      - work/r233-directstorage-sync-cache
      - work/r232-directstorage-read-path
      - work/r231-directstorage-runtime-loading
      - work/r230-directstorage-archive-cache
      - work/r229-streaming-pin-range
      - work/r228-streaming-policy
      - work/r227-preparation-streaming-foundation
      - work/r226-native-material-resolver
      - work/r224-native-material-diffs
      - work/r223-native-dirty-writers
      - work/r222-native-cpu-investigation
      - work/r221-native-append-bypass
      - work/r220-native-rt-pointer
      - work/r219-native-rt-append
      - work/r218-native-cpu-timing
      - work/r217-gi-current-smoothing
      - experiment/native-hit-capture-r118
      - experiment/pt-reflections-p0
      - experiment/pt-verify-stages-20261010
      - experiment/pt-local-light-probe-p1
      - experiment/pt-local-light-record-audit
      - experiment/pt-local-light-gates-p1
      - experiment/pt-local-light-hit-validation-p1
      - experiment/pt-secondary-normal-proof-v7
      - experiment/pt-two-layer-bounce-proof
      - experiment/pt-secondary-origin-precision
      - experiment/pt-secondary-material-filter
      - experiment/pt-hit-uav-coherence
      - experiment/pt-hit-rejection-diagnostic
      - experiment/pt-material-buffer-bounds
      - experiment/pt-overlay-toggle
      - experiment/pt-native-secondary-shading
      - experiment/pt-bounce-energy
      - experiment/rr-clean-baseline-r21
      - experiment/rr-gi-capture-r28
      - experiment/rr-gi-samples-r29
      - experiment/rr-gi-samples-r30
      - experiment/rr-gi-live-samples-r31
      - experiment/rr-dlaa-profile-r32
      - experiment/rr-gi-selection-fix-r33
      - experiment/glass-only-restore-r34
      - experiment/native-reflection-continuation-r35
      - experiment/glass-lighting-direction-r36
      - experiment/glass-native-light-preserve-r37
      - experiment/glass-shadow-filter-r38
      - experiment/reflected-character-material-audit-r39
      - fix/glass-only-remove-opaque-r40
      - experiment/native-graphics-menu-r41
      - experiment/native-lighting-live-r54
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify actual CMD component selection
        shell: cmd
        run: |
          python tools/test-spec-component-launch.py
          if errorlevel 1 exit /b 1
          python tools/test-spec-local-launch.py
          if errorlevel 1 exit /b 1
          python tools/test-spec-indirect-launch.py
          if errorlevel 1 exit /b 1
          python tools/test-spec-environment-launch.py
          if errorlevel 1 exit /b 1
          python tools/test-spec-volume-launch.py
          if errorlevel 1 exit /b 1
          python tools/test-compact-distance-launch.py
          if errorlevel 1 exit /b 1

      - name: Configure MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%I"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          echo VSROOT=%VSROOT%>>%GITHUB_ENV%

      - name: Validate native CPU timing and call patches
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist build mkdir build
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-native-rt-append.cpp /Febuild\test-native-rt-append.exe
          if errorlevel 1 exit /b 1
          build\test-native-rt-append.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-native-cpu-metrics.cpp /Febuild\test-native-cpu-metrics.exe
          if errorlevel 1 exit /b 1
          build\test-native-cpu-metrics.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-native-cpu-workload.cpp /Febuild\test-native-cpu-workload.exe
          if errorlevel 1 exit /b 1
          build\test-native-cpu-workload.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-native-material-diff.cpp /Febuild\test-native-material-diff.exe
          if errorlevel 1 exit /b 1
          build\test-native-material-diff.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 tools\test-native-cpu-runtime.cpp /Febuild\test-native-cpu-runtime.exe
          if errorlevel 1 exit /b 1
          build\test-native-cpu-runtime.exe
          if errorlevel 1 exit /b 1

      - name: Build and validate preparation phase accounting
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /O2 tools\test-native-preparation-phases.cpp /Febuild\test-native-preparation-phases.exe
          if errorlevel 1 exit /b 1
          build\test-native-preparation-phases.exe
          if errorlevel 1 exit /b 1

      - name: Fetch pinned DirectStorage SDK 1.3
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $url='https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.directstorage/1.3.0/microsoft.direct3d.directstorage.1.3.0.nupkg'
          Invoke-WebRequest $url -OutFile build/dstorage-sdk.zip
          if ((Get-FileHash build/dstorage-sdk.zip -Algorithm SHA256).Hash.ToLower() -ne '8ab6c1082537565388b79050d94fdd7f5f437cd0f1d909e7b19f786042b97177') { throw 'DirectStorage SDK hash mismatch' }
          Expand-Archive build/dstorage-sdk.zip build/dstorage-sdk -Force
          New-Item -ItemType Directory -Force build/DirectStorage | Out-Null
          Copy-Item build/dstorage-sdk/native/bin/x64/dstorage.dll,build/dstorage-sdk/native/bin/x64/dstoragecore.dll build/DirectStorage
          Copy-Item build/dstorage-sdk/LICENSE.txt,build/dstorage-sdk/LICENSE-CODE.txt,build/dstorage-sdk/NOTICES.txt build/DirectStorage

      - name: Build DirectStorage file-to-GPU validator
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /O2 /Ibuild\dstorage-sdk\native\include tools\directstorage\validate.cpp /Febuild\DirectStorage\ControlFG-DirectStorage-Validate.exe /link /LIBPATH:build\dstorage-sdk\native\lib\x64 dstorage.lib d3d12.lib dxgi.lib
          if errorlevel 1 exit /b 1

      - name: Validate DirectStorage payload transfer
        shell: powershell
        run: |
          & build/DirectStorage/ControlFG-DirectStorage-Validate.exe | Tee-Object build/DirectStorage/CI-Validation.log
          if ($LASTEXITCODE -ne 0) { throw 'DirectStorage byte validation failed' }

      - name: Validate native texture contracts and D3D12 layouts
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /O2 tools\test-native-texture-contract.cpp /Febuild\TestNativeTextureContract.exe /link d3d12.lib dxgi.lib
          if errorlevel 1 exit /b 1
          build\TestNativeTextureContract.exe
          if errorlevel 1 exit /b 1

      - name: Validate native packed texture GPU transport
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /O2 tools\directstorage\compile-packed-shader.cpp /Febuild\CompilePackedShader.exe /link d3d12.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\CompilePackedShader.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /Ibuild\dstorage-sdk\native\include tools\directstorage\test-packed-textures.cpp /Febuild\DirectStorage\TestPackedTextures.exe /link /LIBPATH:build\dstorage-sdk\native\lib\x64 dstorage.lib d3d12.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\DirectStorage\TestPackedTextures.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 tools\diagnostics\test-storage-selection.cpp /Febuild\TestStorageSelection.exe
          if errorlevel 1 exit /b 1
          build\TestStorageSelection.exe
          if errorlevel 1 exit /b 1

      - name: Validate native DirectStorage archive cache
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /O2 tools\test-loader-candidate.cpp /Febuild\TestLoaderCandidate.exe
          if errorlevel 1 exit /b 1
          build\TestLoaderCandidate.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 tools\test-loader-stages.cpp /Febuild\TestLoaderStages.exe
          if errorlevel 1 exit /b 1
          build\TestLoaderStages.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 tools\test-loader-trace.cpp /Febuild\TestLoaderTrace.exe
          if errorlevel 1 exit /b 1
          build\TestLoaderTrace.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 tools\test-loader-trace-runtime.cpp /Febuild\TestLoaderTraceRuntime.exe
          if errorlevel 1 exit /b 1
          build\TestLoaderTraceRuntime.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 tools\directstorage\test-prefetch-window.cpp /Febuild\TestPrefetchWindow.exe
          if errorlevel 1 exit /b 1
          build\TestPrefetchWindow.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /Ibuild\dstorage-sdk\native\include tools\directstorage\test-early-reader.cpp /Febuild\DirectStorage\ControlFG-Early-Validate.exe /link /LIBPATH:build\dstorage-sdk\native\lib\x64 dstorage.lib
          if errorlevel 1 exit /b 1
          build\DirectStorage\ControlFG-Early-Validate.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /Ibuild\dstorage-sdk\native\include tools\directstorage\test-archive-cache.cpp /Febuild\DirectStorage\ControlFG-Archive-Validate.exe /link /LIBPATH:build\dstorage-sdk\native\lib\x64 dstorage.lib
          if errorlevel 1 exit /b 1
          build\DirectStorage\ControlFG-Archive-Validate.exe
          if errorlevel 1 exit /b 1

      - name: Validate EXE-adjacent DirectStorage dynamic loading
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist build\StorageIntegration mkdir build\StorageIntegration
          copy /y build\DirectStorage\dstorage.dll build\StorageIntegration\dstorage.dll
          copy /y build\DirectStorage\dstoragecore.dll build\StorageIntegration\dstoragecore.dll
          cl /nologo /std:c++17 /EHsc /W4 /O2 /Ibuild\dstorage-sdk\native\include tools\directstorage\test-runtime-loading.cpp /Febuild\StorageIntegration\ControlFG-Storage-Loading-Test.exe
          if errorlevel 1 exit /b 1
          pushd "%SystemRoot%"
          "%GITHUB_WORKSPACE%\build\StorageIntegration\ControlFG-Storage-Loading-Test.exe"
          set "STORAGE_TEST_EXIT=%ERRORLEVEL%"
          popd
          exit /b %STORAGE_TEST_EXIT%

      - name: Validate compact reflection capture on WARP
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist build mkdir build
          cl /nologo /std:c++17 /EHsc /W4 /Isrc validation\reflection-backend\test_backend.cpp /Febuild\backend-full.exe
          if errorlevel 1 exit /b 1
          build\backend-full.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc tools\test-rr-temporal-probe.cpp /Febuild\temporal-probe.exe
          if errorlevel 1 exit /b 1
          build\temporal-probe.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 tools\test-free-camera-control.cpp /Febuild\free-camera-control.exe
          if errorlevel 1 exit /b 1
          build\free-camera-control.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 tools\test-native-blend-capture.cpp /Febuild\native-blend-capture.exe
          if errorlevel 1 exit /b 1
          build\native-blend-capture.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc tools\test-rr-suite-policy.cpp /Febuild\suite-policy.exe
          if errorlevel 1 exit /b 1
          build\suite-policy.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /Isrc /DCONTROL_RR_COMPACT_DISTANCE validation\reflection-backend\test_backend.cpp /Febuild\backend-compact.exe
          if errorlevel 1 exit /b 1
          build\backend-compact.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 tools\test-compact-distance-policy.cpp /Febuild\compact-policy.exe
          if errorlevel 1 exit /b 1
          build\compact-policy.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 tools\test-compact-distance-copy.cpp /Febuild\compact-copy.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compact-copy.exe
          if errorlevel 1 exit /b 1

      - name: Validate emitted spotlight PCF instructions on WARP
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /EHsc /std:c++17 tools/test-spot-bilinear-validation.cpp /Fe:spot-bilinear-test.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1
          spot-bilinear-test.exe
          if errorlevel 1 exit /b 1

      - name: Validate RT spotlight contract and capture
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /EHsc /std:c++17 /W4 /WX tools/test-rt-shadow-candidates.cpp /Fe:rt-shadow-candidates.exe
          if errorlevel 1 exit /b 1
          rt-shadow-candidates.exe
          if errorlevel 1 exit /b 1
          python tools/test-rt-shadow-capture.py
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /std:c++17 /W4 /WX tools/test-rt-spot-shadow-contract.cpp /Fe:rt-spot-contract.exe
          if errorlevel 1 exit /b 1
          rt-spot-contract.exe
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /std:c++17 /W4 /WX tools/test-rt-spot-culling.cpp /Fe:rt-spot-culling.exe
          if errorlevel 1 exit /b 1
          rt-spot-culling.exe
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /std:c++17 /W4 /WX tools/test-rt-shadow-observer.cpp /Fe:rt-shadow-observer.exe /link bcrypt.lib
          if errorlevel 1 exit /b 1
          rt-shadow-observer.exe
          if errorlevel 1 exit /b 1

      - name: Test spotlight resolution policy
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /EHsc /std:c++17 tools/test-spot-shadow-resolution.cpp /Fe:spot-resolution-test.exe
          if errorlevel 1 exit /b 1
          spot-resolution-test.exe
          if errorlevel 1 exit /b 1

      - name: Prepare audited world albedo shaders
        shell: cmd
        run: python tools/generate-rr-world-albedo.py

      - name: Prepare Streamline and generated shaders
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist build mkdir build
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Fetch-Streamline.ps1
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Verify-Streamline.ps1
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Verify-RRRuntime.ps1
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-distance.cpp /Fobuild\compile-distance.obj /Febuild\compile-distance.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-distance.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-live.cpp /Fobuild\compile-live.obj /Febuild\compile-live.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-live.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-rr-hair-opacity.cpp /Fobuild\compile-rr-hair-opacity.obj /Febuild\compile-rr-hair-opacity.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-rr-hair-opacity.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-rr-character-base-albedo.cpp /Fobuild\compile-rr-character-base-albedo.obj /Febuild\compile-rr-character-base-albedo.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-rr-character-base-albedo.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-skin-mask.cpp /Fobuild\compile-skin-mask.obj /Febuild\compile-skin-mask.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-skin-mask.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-reflectance.cpp /Fobuild\compile-reflectance.obj /Febuild\compile-reflectance.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-reflectance.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-fg-ui-alpha.cpp /Fobuild\compile-fg-ui-alpha.obj /Febuild\compile-fg-ui-alpha.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-fg-ui-alpha.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-clamp-strength.cpp /Fobuild\compile-clamp-strength.obj /Febuild\compile-clamp-strength.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-clamp-strength.exe
          if errorlevel 1 exit /b 1
          build\compile-clamp-strength.exe --temporal
          if errorlevel 1 exit /b 1
          copy /y src\rr_clamp_variants.in.h build\rr_clamp_variants.h >nul
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-pt-reflection-p2-composite.cpp /Fobuild\compile-pt-reflection-p2-composite.obj /Febuild\compile-pt-reflection-p2-composite.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-pt-reflection-p2-composite.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /O2 /MT tools\compile-pt-reflection-p2-diffuse-bridge.cpp /Fobuild\compile-pt-reflection-p2-diffuse-bridge.obj /Febuild\compile-pt-reflection-p2-diffuse-bridge.exe /link d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\compile-pt-reflection-p2-diffuse-bridge.exe
          if errorlevel 1 exit /b 1

      - name: Prepare validated RT spotlight shader pair
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content assets/rt-spot/manifest.json -Raw | ConvertFrom-Json
          foreach ($entry in $manifest.outputs.PSObject.Properties) {
            $name=$entry.Name
            $bytes=[Convert]::FromBase64String((Get-Content "assets/rt-spot/$name.b64" -Raw))
            [IO.File]::WriteAllBytes("$pwd/build/$name",$bytes)
            if ((Get-FileHash "build/$name" -Algorithm SHA256).Hash.ToLower() -ne $entry.Value.sha256) { throw "Shader hash mismatch: $name" }
          }

      - name: Generate isolated spotlight visibility diagnostic
        run: |
          python tools/rt_spot_history_guard.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/test-rt-spot-history-guard.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/generate-shadow-isolation.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/test-native-shadow-blend.py
          if($LASTEXITCODE -ne 0){throw "Native shadow blend checks failed"}
          python tools/test-map-sidecar.py
          if($LASTEXITCODE -ne 0){throw "Map sidecar checks failed"}
          python tools/test-map-visibility-probe.py
          if($LASTEXITCODE -ne 0){throw "Map visibility probe checks failed"}
          python tools/test-shadow-isolation.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/generate-spot-open.py
          python tools/generate-spot-band-colors.py
          python tools/rt_spot_hit_position.py
          python tools/test-rt-spot-hit-position.py
          python tools/test-shadow-blocker-analysis.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/test-light-transition.py
          python tools/test-package-lighting-capture.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/test-spot-hit-capture.py
          python tools/rt_spot_projection.py
          if($LASTEXITCODE -ne 0){throw "Projection shader preparation failed"}
          python tools/test-rt-spot-projection.py
          if($LASTEXITCODE -ne 0){throw "Projection shader checks failed"}
          python tools/rt_spot_authored_clip.py
          python tools/test-rt-spot-authored-clip.py
          python tools/rt_spot_blocker.py
          python tools/test-rt-spot-blocker.py

      - name: Validate RT spotlight composition and history shaders on WARP
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /EHsc /std:c++17 /W4 /WX tools/test-rt-spot-shaders.cpp /Fe:rt-spot-shaders.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1
          rt-spot-shaders.exe
          if errorlevel 1 exit /b 1
          python tools/test-rt-spot-diagnostics.py
          if errorlevel 1 exit /b 1
          python tools/test-rt-spot-selection.py
          if errorlevel 1 exit /b 1
          python tools/test-rt-spot-canonical.py
          if errorlevel 1 exit /b 1
          python tools/test-rt-spot-contribution.py
          if errorlevel 1 exit /b 1
          python tools/test-rt-spot-segments.py
          if errorlevel 1 exit /b 1
          python tools/test-rt-spot-samples.py
          if errorlevel 1 exit /b 1
          python tools/test-rt-spot-filter.py
          if errorlevel 1 exit /b 1
          python tools/test-rt-spot-history.py
          if errorlevel 1 exit /b 1

      - name: Check secondary ray origin precision
        run: python tools/test-pt-secondary-origin.py

      - name: Audit native PT reflection contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python tools/audit-pt-reflection-native.py build/pt-reflection-native-audit.json
          if($LASTEXITCODE -ne 0){throw "Native reflection audit failed: $LASTEXITCODE"}
      - name: Build audited DXIL assembler and validator
        shell: cmd
        run: |
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\assemble-validated-dxil.cpp /Febuild\assemble-validated-dxil.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc research\spec-performance\validate.cpp /Febuild\spec-validate.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 tools\test-spec-phase-gpu.cpp /Febuild\test-spec-phase-gpu.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1

      - name: Compile PT reflection DXIL libraries
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $pf86=[Environment]::GetFolderPath('ProgramFilesX86')
          $pf=[Environment]::GetFolderPath('ProgramFiles')
          $roots=@(
            (Join-Path $pf86 'Windows Kits\10\bin'),
            (Join-Path $pf 'Microsoft Visual Studio'),
            (Join-Path $pf86 'Microsoft Visual Studio')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          $dxc=$null
          foreach($root in $roots){
            $candidate=Get-ChildItem -LiteralPath $root -Filter dxc.exe -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if($candidate){$dxc=$candidate.FullName;break}
          }
          if(-not $dxc){throw 'dxc.exe was not found in the Windows SDK / Visual Studio installation.'}
          Write-Host "DXC: $dxc"
          python tools/test-spec-zero-radius.py
