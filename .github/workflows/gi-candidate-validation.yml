name: Validate no-reuse GI candidate GPU accounting
on:
  push:
    branches: [work/gi-candidate-gpu-r277]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate CPU accounting and generate GPU fixture
        shell: cmd
        run: |
          python tools/test-gi-candidate-contract.py
          if errorlevel 1 exit /b 1
          python tools/make-gi-candidate-fixture.py research/gi-source-r267/candidate-gpu-fixture.json build/gi_candidate_fixture.h
          if errorlevel 1 exit /b 1
      - name: Execute D3D12 candidate path on WARP
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%I"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-gi-candidate-gpu.cpp /Febuild\test-gi-candidate-gpu.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\test-gi-candidate-gpu.exe
          if errorlevel 1 exit /b 1
