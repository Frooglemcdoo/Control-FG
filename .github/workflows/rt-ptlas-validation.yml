name: Build PTLAS replacement validation
on:
  push:
    branches: [work/rt-replacement-r392]
    paths:
      - 'src/rt_*'
      - 'tools/ptlas/**'
      - 'tools/test-rt-*.cpp'
      - '.github/workflows/rt-ptlas-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure, compile and test portable ownership contracts
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/dxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$dxc) { throw 'Windows SDK DXC not found' }
          cmake -S tools/ptlas -B build-ptlas -A x64 "-DDXC_EXECUTABLE=$($dxc.FullName)"
          if ($LASTEXITCODE) { throw 'CMake configure failed' }
          cmake --build build-ptlas --config Release --parallel 2
          if ($LASTEXITCODE) { throw 'Build failed' }
          ctest --test-dir build-ptlas -C Release --output-on-failure
          if ($LASTEXITCODE) { throw 'Portable tests failed' }
      - name: Package standalone GPU validation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ptlas-package | Out-Null
          Copy-Item build-ptlas/Release/Control-PTLAS-Validate.exe,build-ptlas/Release/probe.dxil,tools/ptlas/Run-PTLAS-Validation.cmd,tools/ptlas/README.txt ptlas-package
          Copy-Item build-ptlas/_deps/nvapi-src/License.txt ptlas-package/NVIDIA-NVAPI-License.txt
          git rev-parse HEAD | Set-Content ptlas-package/source-commit.txt
          Get-ChildItem ptlas-package -File | Get-FileHash -Algorithm SHA256 | Select-Object Hash,Path | ConvertTo-Json | Set-Content ptlas-package/SHA256.json
      - uses: actions/upload-artifact@v4
        with:
          name: Control-PTLAS-Validation
          path: ptlas-package/
          if-no-files-found: error
