name: Validate GI guiding research
on:
  push:
    branches: [work/gi-guiding-validation-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and validate research samplers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force build | Out-Null
          cl /nologo /std:c++17 /EHsc /W4 tools/test-gi-directional-guide.cpp /Febuild/test-guide.exe
          if($LASTEXITCODE -ne 0){throw 'CPU proposal compile failed'}
          ./build/test-guide.exe
          if($LASTEXITCODE -ne 0){throw 'CPU proposal validation failed'}
          cl /nologo /std:c++17 /EHsc /W4 tools/test-gi-world-directional-guide.cpp /Febuild/test-world-guide.exe
          if($LASTEXITCODE -ne 0){throw 'World proposal compile failed'}
          ./build/test-world-guide.exe
          if($LASTEXITCODE -ne 0){throw 'World proposal validation failed'}
          $root=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Windows Kits\10\bin'
          $dxc=(Get-ChildItem -LiteralPath $root -Filter dxc.exe -File -Recurse | Where-Object {$_.FullName -match '\\x64\\'} | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if(-not $dxc){throw 'DXC unavailable'}
          Write-Host "DXC: $dxc"
          & $dxc -T cs_6_0 -E Sample -HV 2018 -O3 -WX tools/gi-guiding-validation.hlsl -Fo gi-guide-sample.dxil
          if($LASTEXITCODE -ne 0){throw 'Sample shader compile failed'}
          & $dxc -T cs_6_0 -E Learn -HV 2018 -O3 -WX tools/gi-guiding-validation.hlsl -Fo gi-guide-learn.dxil
          if($LASTEXITCODE -ne 0){throw 'Learning shader compile failed'}
          & $dxc -T cs_6_0 -E Prepare -HV 2018 -O3 -WX tools/gi-guiding-validation.hlsl -Fo gi-guide-prepare.dxil
          if($LASTEXITCODE -ne 0){throw 'Table preparation shader compile failed'}
          & $dxc -T cs_6_0 -E Publish -HV 2018 -O3 -WX tools/gi-guiding-validation.hlsl -Fo gi-guide-publish.dxil
          if($LASTEXITCODE -ne 0){throw 'Publication shader compile failed'}
          cl /nologo /std:c++17 /EHsc /W4 tools/test-gi-guiding-gpu.cpp /Febuild/test-guiding-gpu.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if($LASTEXITCODE -ne 0){throw 'GPU fixture compile failed'}
          ./build/test-guiding-gpu.exe
          if($LASTEXITCODE -ne 0){throw 'GPU validation failed'}
          python tools/make-gi-candidate-fixture.py research/gi-source-r267/candidate-gpu-fixture.json build/gi_candidate_fixture.h
          if($LASTEXITCODE -ne 0){throw 'Captured accounting fixture generation failed'}
          & $dxc -T cs_6_0 -E main -HV 2018 -O3 -WX tools/gi-guided-accounting-validation.hlsl -Fo gi-guided-accounting.dxil
          if($LASTEXITCODE -ne 0){throw 'Guided accounting shader compile failed'}
          cl /nologo /std:c++17 /EHsc /W4 tools/test-gi-guided-accounting-gpu.cpp /Febuild/test-guided-accounting.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if($LASTEXITCODE -ne 0){throw 'Guided accounting fixture compile failed'}
          ./build/test-guided-accounting.exe
          if($LASTEXITCODE -ne 0){throw 'Captured guided accounting validation failed'}
          & $dxc -T cs_6_0 -E Learn -D GI_GUIDE_CURRENT_FRAME=1 -HV 2018 -O3 -WX tools/gi-guiding-validation.hlsl -Fo gi-guide-learn-current.dxil
          if($LASTEXITCODE -ne 0){throw 'Current-frame learning compile failed'}
          cl /nologo /std:c++17 /EHsc /W4 /DGI_GUIDE_CURRENT_FRAME tools/test-gi-guiding-gpu.cpp /Febuild/test-current-guide.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if($LASTEXITCODE -ne 0){throw 'Current-frame fixture compile failed'}
          ./build/test-current-guide.exe
          if($LASTEXITCODE -ne 0){throw 'Current-frame split validation failed'}
