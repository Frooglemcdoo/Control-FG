name: Build owned GI producer hardware test
on:
  push:
    branches: [work/gi-modernization]
    paths:
      - src/gi_reuse/**
      - src/shaders/gi_producer*.hlsl
      - tools/test-gi-producer-dxr.cpp
      - tools/gpu_test_device.h
      - tools/gi-producer-test/**
      - .github/workflows/gi-producer-backend.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build actual producer shader and hardware test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $vs=& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dxc=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$dxc -or !$vs) { throw 'Compiler unavailable' }
          New-Item -ItemType Directory -Force package | Out-Null
          & $dxc.FullName -T lib_6_5 -WX src/shaders/gi_producer_trace.hlsl -Fo package/gi-producer-trace.dxil
          if ($LASTEXITCODE -ne 0) { throw 'Producer shader compile failed' }
          $commands=@"
          call "$vs\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 /MT tools\test-gi-producer-dxr.cpp /Fe:package\GI-Producer-Test.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          exit /b %errorlevel%
          "@
          [IO.File]::WriteAllText("$pwd/compile-gi-backend.cmd",$commands)
          cmd /c compile-gi-backend.cmd
          if ($LASTEXITCODE -ne 0) { throw 'GPU executable compile failed' }
      - name: Package hardware test
        shell: powershell
        run: |
          Copy-Item tools/gi-producer-test/* package
          Compress-Archive -Path package/* -DestinationPath Control-GI-Producer-Test.zip
          (Get-FileHash Control-GI-Producer-Test.zip -Algorithm SHA256).Hash | Set-Content Control-GI-Producer-Test.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Control-GI-Producer-Test
          path: |
            Control-GI-Producer-Test.zip
            Control-GI-Producer-Test.sha256
