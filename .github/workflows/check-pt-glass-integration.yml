name: Check glass lighting integration components
on:
  push:
    branches: [experiment/pt-glass-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test native DXR call routing
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%I"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist build mkdir build
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-glass-vtable-call.cpp /Febuild\test-glass-call.exe
          if errorlevel 1 exit /b 1
          build\test-glass-call.exe
          if errorlevel 1 exit /b 1
      - name: Verify glossy-only removal and native fallback
        run: python tools/test-pt-glass-glossy-only.py
      - name: Verify glass installation compatibility gate
        run: python tools/test-pt-glass-install.py
      - name: Compile terminal GI dependency for native-root validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force build | Out-Null
          $pf86=[Environment]::GetFolderPath('ProgramFilesX86')
          $pf=[Environment]::GetFolderPath('ProgramFiles')
          $roots=@(
            (Join-Path $pf86 'Windows Kits\10\bin'),
            (Join-Path $pf 'Microsoft Visual Studio'),
            (Join-Path $pf86 'Microsoft Visual Studio')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          $dxc=$null
          foreach($root in $roots){
            $candidate=Get-ChildItem -LiteralPath $root -Filter dxc.exe -File -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if($candidate){$dxc=$candidate.FullName;break}
          }
          if(-not $dxc){throw 'dxc.exe was not found in the Windows SDK / Visual Studio installation.'}
          Write-Host "DXC: $dxc"
          & $dxc -T cs_6_0 -E main -HV 2021 -O3 -WX -I src/shaders -Fo build/pt_terminal_gi_compute.dxil src/shaders/pt_terminal_gi_compute.hlsl
          if($LASTEXITCODE -ne 0){throw "Terminal GI compile failed: $LASTEXITCODE"}
      - name: Compile native and dedicated secondary lighting
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%I"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist build mkdir build
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\compile-pt-glass-lighting.cpp /Febuild\compile-pt-glass-lighting.exe /link d3dcompiler.lib d3d12.lib dxgi.lib
          if errorlevel 1 exit /b 1
          build\compile-pt-glass-lighting.exe
          if errorlevel 1 exit /b 1
      - name: Test GPU resource lifetime on WARP
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%I"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-glass-resources.cpp /Febuild\test-pt-glass-resources.exe /link d3d12.lib dxgi.lib
          if errorlevel 1 exit /b 1
          build\test-pt-glass-resources.exe
          if errorlevel 1 exit /b 1
      - name: Test descriptor isolation and binding restoration on WARP
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%I"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-pt-glass-descriptors.cpp /Febuild\test-pt-glass-descriptors.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\test-pt-glass-descriptors.exe
          if errorlevel 1 exit /b 1
      - name: Verify existing rendering runtime stays unchanged
        run: python tools/test-pt-secondary-encoding.py
