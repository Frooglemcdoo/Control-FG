name: Validate GI replacement core
on:
  push:
    branches: [work/gi-replacement-core-r425, work/gi-replacement-binding-r426]
  workflow_dispatch:
# Superseded builds of this same branch must not delay current validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute shared sampler
        shell: powershell
        run: |
          $vs=& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dxc=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$dxc) { throw 'DXC unavailable' }
          & $dxc.FullName -T cs_6_0 -E main -HV 2018 -WX tools/gi-frozen-world-validation.hlsl -Fo gi-frozen-world.dxil
          if ($LASTEXITCODE -ne 0) { throw 'Sampler HLSL compile failed' }
          python -c "import base64; from pathlib import Path; [Path('gi-native-'+str(i)+'.dxil').write_bytes(base64.b64decode(Path('research/gi-sequence-r264/gi-ray-'+str(i)+'.dxbc.b64').read_text())) for i in range(2)]"
          if ($LASTEXITCODE -ne 0) { throw 'Native shader decode failed' }
          foreach ($variant in @(0,1)) {
            & $dxc.FullName -dumpbin "gi-native-$variant.dxil" | Set-Content "gi-native-$variant.ll" -Encoding UTF8
            if ($LASTEXITCODE -ne 0) { throw 'Native shader inspection failed' }
          }
          foreach ($entry in @('Clear','Claim','Accumulate','Freeze')) {
            & $dxc.FullName -T cs_6_0 -E $entry -HV 2018 -WX src/shaders/gi_frozen_guide_build.hlsl -Fo "gi-guide-$entry.dxil"
            if ($LASTEXITCODE -ne 0) { throw "Guide builder compile failed: $entry" }
          }
          & $dxc.FullName -T lib_6_3 -HV 2018 -WX src/shaders/gi_frozen_raygen.hlsl -Fo gi-frozen-raygen.dxil
          if ($LASTEXITCODE -ne 0) { throw 'Frozen raygen compile failed' }
          python tools/gi_frozen_evaluator.py --output gi-frozen-evaluator.hlsl
          if ($LASTEXITCODE -ne 0) { throw 'Frozen evaluator generation failed' }
          & $dxc.FullName -T cs_6_0 -E main -HV 2018 -WX -I src/shaders gi-frozen-evaluator.hlsl -Fo gi-frozen-evaluator.dxil
          if ($LASTEXITCODE -ne 0) { throw 'Frozen evaluator compile failed' }
          python -c "from pathlib import Path; p=Path('gi-frozen-evaluator.hlsl'); Path('gi-frozen-evaluator-test-main.hlsl').write_text(p.read_text().replace('gi_evaluator_secondary.generated.hlsl','gi-frozen-evaluator-fixture.hlsl'))"
          & $dxc.FullName -T cs_6_0 -E main -HV 2018 -WX -I src/shaders -I tools gi-frozen-evaluator-test-main.hlsl -Fo gi-frozen-evaluator-fixture.dxil
          if ($LASTEXITCODE -ne 0) { throw 'Frozen evaluator fixture compile failed' }
          python tools/build-gi-frozen.py --dxc $dxc.FullName --output build/frozen
          if ($LASTEXITCODE -ne 0) { throw 'Frozen runtime bundle failed' }
          $commands=@"
          call "$vs\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\assemble-validated-dxil.cpp /Fe:assemble-validated-dxil.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-gi-compute-root-arguments.cpp /Fe:gi-compute-root-arguments.exe
          if not "%errorlevel%"=="0" exit /b 1
          gi-compute-root-arguments.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /W4 /WX tools\test-gi-frozen-world-guide.cpp /Fe:gi-frozen-cpu.exe
          if not "%errorlevel%"=="0" exit /b 1
          gi-frozen-cpu.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 tools\test-gi-frozen-world-guide-gpu.cpp /Fe:gi-frozen-gpu.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          gi-frozen-gpu.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-gi-scene-audit.cpp /Fe:gi-scene.exe /link d3d12.lib
          if not "%errorlevel%"=="0" exit /b 1
          gi-scene.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-gi-phase-audit.cpp /Fe:gi-phase.exe /link d3d12.lib dxgi.lib
          if not "%errorlevel%"=="0" exit /b 1
          gi-phase.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-gi-split-phase-plan.cpp /Fe:gi-split.exe
          if not "%errorlevel%"=="0" exit /b 1
          gi-split.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-gi-split-recording-lease.cpp /Fe:gi-split-lease.exe
          if not "%errorlevel%"=="0" exit /b 1
          gi-split-lease.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-gi-split-owner-retirement.cpp /Fe:gi-split-owner.exe
          if not "%errorlevel%"=="0" exit /b 1
          gi-split-owner.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-gi-frozen-working-set-gpu.cpp /Fe:gi-frozen-working-set.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          gi-frozen-working-set.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-gi-guide-build-gpu.cpp /Fe:gi-guide-build.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          gi-guide-build.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-gi-phase-bindings-gpu.cpp /Fe:gi-phase-bindings.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          gi-phase-bindings.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-gi-sbt-snapshot-gpu.cpp /Fe:gi-sbt-snapshot.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          gi-sbt-snapshot.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-gi-ray-constants-gpu.cpp /Fe:gi-ray-constants.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          gi-ray-constants.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-gi-frozen-evaluator-gpu.cpp /Fe:gi-frozen-evaluator.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          gi-frozen-evaluator.exe
          if not "%errorlevel%"=="0" exit /b 1
          "@
          Set-Content -Path validate-gi-core.cmd -Value $commands -Encoding ASCII
          cmd /c validate-gi-core.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Sampler validation failed' }
          python tools/test-gi-compact-phase.py --source gi-native-0.ll
          if ($LASTEXITCODE -ne 0) { throw 'Compact receiver contract failed' }
          python tools/gi_compact_phase.py --source gi-native-0.ll --assembler ./assemble-validated-dxil.exe --compiler-dll (Join-Path $dxc.DirectoryName 'dxcompiler.dll') --output compact-gi
          if ($LASTEXITCODE -ne 0) { throw 'Compact DXIL validation failed' }
      - name: Validate phase metadata collection
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/test-gi-scene-collector.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Scene collector failed' }
          & tools/test-gi-phase-collector.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Phase collector failed' }
          & tools/test-gi-pipeline-collector.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Pipeline collector failed' }
          python tools/test-gi-scene-check.py
          if ($LASTEXITCODE -ne 0) { throw 'Scene parser failed' }
          python tools/test-gi-phase-check.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase parser failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: gi-core-native-contract
          path: gi-native-*.ll
          retention-days: 7
