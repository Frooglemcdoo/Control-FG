name: Validate GI replacement core
on:
  push:
    branches: [work/gi-replacement-core-r425]
  workflow_dispatch:
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute shared sampler
        shell: powershell
        run: |
          $vs=& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dxc=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$dxc) { throw 'DXC unavailable' }
          & $dxc.FullName -T cs_6_0 -E main -HV 2018 -WX tools/gi-frozen-world-validation.hlsl -Fo gi-frozen-world.dxil
          if ($LASTEXITCODE -ne 0) { throw 'Sampler HLSL compile failed' }
          foreach ($entry in @('Clear','Accumulate','Freeze')) {
            & $dxc.FullName -T cs_6_0 -E $entry -HV 2018 -WX src/shaders/gi_frozen_guide_build.hlsl -Fo "gi-guide-$entry.dxil"
            if ($LASTEXITCODE -ne 0) { throw "Guide builder compile failed: $entry" }
          }
          $commands=@"
          call "$vs\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /O2 /W4 /WX tools\test-gi-frozen-world-guide.cpp /Fe:gi-frozen-cpu.exe
          if not "%errorlevel%"=="0" exit /b 1
          gi-frozen-cpu.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 tools\test-gi-frozen-world-guide-gpu.cpp /Fe:gi-frozen-gpu.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          gi-frozen-gpu.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-gi-phase-audit.cpp /Fe:gi-phase.exe /link d3d12.lib dxgi.lib
          if not "%errorlevel%"=="0" exit /b 1
          gi-phase.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-gi-split-phase-plan.cpp /Fe:gi-split.exe
          if not "%errorlevel%"=="0" exit /b 1
          gi-split.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-gi-guide-build-gpu.cpp /Fe:gi-guide-build.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          gi-guide-build.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 tools\test-gi-phase-bindings-gpu.cpp /Fe:gi-phase-bindings.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          gi-phase-bindings.exe
          if not "%errorlevel%"=="0" exit /b 1
          "@
          Set-Content -Path validate-gi-core.cmd -Value $commands -Encoding ASCII
          cmd /c validate-gi-core.cmd
          if ($LASTEXITCODE -ne 0) { throw 'Sampler validation failed' }
      - name: Validate phase metadata collection
        shell: powershell
        run: |
          & tools/test-gi-phase-collector.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Phase collector failed' }
          python tools/test-gi-phase-check.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase parser failed' }
