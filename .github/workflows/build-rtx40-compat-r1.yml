name: Build RTX40 compatibility R1

on:
  push:
    branches:
      - fix/rtx40-61714-device-policy-r1
    paths:
      - ".github/workflows/build-rtx40-compat-r1.yml"
      - "src/probe.cpp"
      - "src/fg_overlay.h"
      - "src/rr_options_r20p.h"
      - "src/rr_native_preset.h"
      - "src/rr_native_frame.h"
      - "src/rr_live_retire.h"
      - "src/rtx40_mfg/patches.cpp"
      - "src/rtx40_mfg/control_bridge.cpp"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Preserve repository bytes
        shell: powershell
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Refresh test source evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $changed = @(
            'src/probe.cpp',
            'src/fg_overlay.h',
            'src/rr_options_r20p.h',
            'src/rr_native_preset.h',
            'src/rr_native_frame.h',
            'src/rr_live_retire.h',
            'src/rtx40_mfg/patches.cpp',
            'src/rtx40_mfg/control_bridge.cpp'
          )
          $checkpointPath = 'validation/current-release/results.json'
          $manifestPath = 'SOURCE-SHA256.json'
          $checkpoint = Get-Content -LiteralPath $checkpointPath -Raw | ConvertFrom-Json
          foreach ($rel in $changed) {
            $hash = (Get-FileHash -LiteralPath $rel -Algorithm SHA256).Hash.ToLowerInvariant()
            $prop = $checkpoint.tested_sha256.PSObject.Properties[$rel]
            if ($null -eq $prop) {
              $checkpoint.tested_sha256 | Add-Member -NotePropertyName $rel -NotePropertyValue $hash
            } else {
              $prop.Value = $hash
            }
          }
          $checkpoint | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $checkpointPath -Encoding UTF8
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          foreach ($rel in @($changed + $checkpointPath)) {
            $hash = (Get-FileHash -LiteralPath $rel -Algorithm SHA256).Hash.ToLowerInvariant()
            $prop = $manifest.PSObject.Properties[$rel]
            if ($null -eq $prop) {
              $manifest | Add-Member -NotePropertyName $rel -NotePropertyValue $hash
            } else {
              $prop.Value = $hash
            }
          }
          $manifest | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $manifestPath -Encoding UTF8

      - name: Build and validate
        shell: cmd
        run: echo.|Build.cmd

      - name: Prepare package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'release/Control-FG-v2.1.1.zip'
          $dst = 'Control-FG-v2.1.1-RTX40-Compatibility-R1.zip'
          if (-not (Test-Path -LiteralPath $src)) { throw 'Expected release package was not produced.' }
          Copy-Item -LiteralPath $src -Destination $dst
          (Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath 'Control-FG-v2.1.1-RTX40-Compatibility-R1.sha256' -Encoding ASCII

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Control-FG-v2.1.1-RTX40-Compatibility-R1
          path: |
            Control-FG-v2.1.1-RTX40-Compatibility-R1.zip
            Control-FG-v2.1.1-RTX40-Compatibility-R1.sha256
            build/build-validation.json
            Build.log
          if-no-files-found: error
          retention-days: 7
