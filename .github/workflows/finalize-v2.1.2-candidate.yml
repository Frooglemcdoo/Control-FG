name: Finalize v2.1.2 candidate source evidence

on:
  push:
    branches:
      - release/v2.1.2-candidate
    paths:
      - ".github/workflows/finalize-v2.1.2-candidate.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit final v2.1.2 source evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f .github/workflows/package-v2.1.2-candidate-source.yml
          rm -f .github/workflows/finalize-v2.1.2-candidate.yml
          git add -u .github/workflows

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess

          root = Path('.')
          baseline = '5f04832d19d9f9be8c447997281e14c123806206'
          checkpoint_path = Path('validation/current-release/results.json')
          manifest_path = Path('SOURCE-SHA256.json')

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          changed = subprocess.check_output(
              ['git','diff','--name-only',baseline,'HEAD'], text=True
          ).splitlines()
          excluded = {
              str(checkpoint_path),
              str(manifest_path),
              '.github/workflows/package-v2.1.2-candidate-source.yml',
              '.github/workflows/finalize-v2.1.2-candidate.yml',
          }

          checkpoint = json.loads(checkpoint_path.read_text(encoding='utf-8-sig'))
          checkpoint['status'] = 'LOCAL_PASS'
          checkpoint['candidate'] = '2.1.2'
          checkpoint['scope'] = (
              'v2.1.2 release candidate: RR VRAM lifecycle fixes, Experimental Texture Streaming, '
              'optional VRAM monitor, RTX 40-series NVIDIA 617.14 / DLSS-G 310.9.1 compatibility, '
              'and updated RR attribution.'
          )
          checkpoint.setdefault('tests', {})['gpu_runtime'] = (
              'PARTIAL: September 29 RR/texture changes user-tested; RTX 40-series 617.14 '
              'compatibility requires final hardware verification.'
          )
          tested = checkpoint.setdefault('tested_sha256', {})
          for rel in changed:
              if rel in excluded or not Path(rel).is_file():
                  continue
              tested[rel] = sha(rel)
          checkpoint_path.write_text(json.dumps(checkpoint, indent=2) + '\n', encoding='utf-8')

          tracked = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          manifest = {}
          for rel in tracked:
              if rel == str(manifest_path):
                  continue
              path = Path(rel)
              if path.is_file():
                  manifest[rel] = sha(rel)
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

          git add validation/current-release/results.json SOURCE-SHA256.json
          git commit -m "Finalize v2.1.2 source evidence"
          git push origin HEAD:release/v2.1.2-candidate
