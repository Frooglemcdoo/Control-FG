name: GI24 Native Diffuse Hybrid Source Package

on:
  push:
    branches: [gi24-native-diffuse-hybrid-source]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Preserve repository bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply GI24 Native Diffuse Hybrid A/B
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @('tools/gi24-apply.part1.txt','tools/gi24-apply.part2.txt','tools/gi24-apply.part3.txt')
          $body = ''
          foreach ($part in $parts) { $body += Get-Content -LiteralPath $part -Raw }
          $script = Join-Path $PWD 'Apply-GI24-CI.ps1'
          [IO.File]::WriteAllText($script,$body,[Text.UTF8Encoding]::new($false))
          & $script -Root $PWD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and validate GI24
        shell: cmd
        run: echo.|Build.cmd
      - name: Package complete integrated GI24 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'release-gi24'
          $rootName = 'Control-FG-v2.1.1-GI24-Native-Diffuse-Hybrid-Source'
          $stage = Join-Path $release $rootName
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $exclude = @('.github/workflows/gi24-source-package.yml','tools/gi24-apply.part1.txt','tools/gi24-apply.part2.txt','tools/gi24-apply.part3.txt')
          foreach ($path in (git ls-files)) {
            if ($exclude -contains $path) { continue }
            $src = Join-Path $PWD $path
            if (-not (Test-Path -LiteralPath $src -PathType Leaf)) { continue }
            $dst = Join-Path $stage $path
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dst) | Out-Null
            Copy-Item -LiteralPath $src -Destination $dst -Force
          }
          foreach ($path in @('GI24-TEST.md','validation/gi24/policy-test.cpp')) {
            $src = Join-Path $PWD $path
            $dst = Join-Path $stage $path
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dst) | Out-Null
            Copy-Item -LiteralPath $src -Destination $dst -Force
          }
          $zip = Join-Path $release ($rootName + '.zip')
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $release 'SHA256SUMS.txt') -Value "$hash  $($rootName).zip" -Encoding ascii
          Write-Host "GI24_SOURCE_SHA256=$hash"
      - name: Upload GI24 source package
        uses: actions/upload-artifact@v4
        with:
          name: Control-FG-v2.1.1-GI24-Source
          path: |
            release-gi24/Control-FG-v2.1.1-GI24-Native-Diffuse-Hybrid-Source.zip
            release-gi24/SHA256SUMS.txt
            build/build-validation.json
            Build.log
          if-no-files-found: error
          retention-days: 7
