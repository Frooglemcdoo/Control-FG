name: Build RR speckle test

on:
  push:
    branches: [rr-speckle-guide-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Preserve repository bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - name: Build B (floored diffuse guide - the fix)
        shell: cmd
        run: echo.|Build.cmd

      - name: Stage B
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item release/Control-FG-v2.1.2.zip out/Control-FG-v2.1.2-RRSpeckle-B-FlooredGuide.zip
          Copy-Item Build.log out/Build-B.log

      - name: Switch to A (flat grey diffuse guide - diagnostic)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'src/shaders/rr_live_guides.hlsl'
          $t = [IO.File]::ReadAllText($p)
          if (-not $t.Contains('#define RR_DIFFUSE_GUIDE_MODE 1')) { throw 'mode define not found' }
          [IO.File]::WriteAllText($p, $t.Replace('#define RR_DIFFUSE_GUIDE_MODE 1', '#define RR_DIFFUSE_GUIDE_MODE 2'))
          python tools/rr-refresh-evidence.py
          if ($LASTEXITCODE -ne 0) { throw 'evidence refresh failed' }
          Remove-Item -Recurse -Force build, release -ErrorAction SilentlyContinue

      - name: Build A
        shell: cmd
        run: echo.|Build.cmd

      - name: Stage A
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item release/Control-FG-v2.1.2.zip out/Control-FG-v2.1.2-RRSpeckle-A-GreyGuide.zip
          Copy-Item Build.log out/Build-A.log
          Get-ChildItem out/*.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content out/SHA256SUMS.txt -Encoding ascii

      - name: Upload test builds
        uses: actions/upload-artifact@v4
        with:
          name: Control-FG-RR-Speckle-Test
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Retain build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Control-FG-RR-Speckle-Test-Failure
          path: Build.log
