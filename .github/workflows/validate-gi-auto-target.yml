name: Validate automatic GI targets
on:
  push:
    branches: [work/gi-auto-target-r448]
  workflow_dispatch:
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile target builder shaders
        shell: pwsh
        run: |
          $roots=@("${env:ProgramFiles(x86)}\Windows Kits\10\bin", "$env:ProgramFiles\Microsoft Visual Studio")
          $dxc=$null
          foreach($root in $roots) {
            if(Test-Path $root) {
              $candidate=Get-ChildItem $root -Filter dxc.exe -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
              if($candidate) {$dxc=$candidate.FullName;break}
            }
          }
          if(-not $dxc) { throw 'DXC not found' }
          foreach($entry in @('Clear','Claim','Accumulate','Freeze')) {
            & $dxc -T cs_6_0 -E $entry -WX src/shaders/gi_auto_target_build.hlsl -Fo "gi-auto-$entry.dxil"
            if($LASTEXITCODE -ne 0) {throw "Compile failed: $entry"}
          }
          & $dxc -T cs_6_0 -E main -WX tools/gi-pilot-resolve-validation.hlsl -Fo gi-pilot-resolve.dxil
          if($LASTEXITCODE -ne 0) {throw 'Pilot compile failed'}
          & $dxc -T cs_6_0 -E main -WX tools/gi-auto-binding-validation.hlsl -Fo gi-auto-binding.dxil
          if($LASTEXITCODE -ne 0) {throw 'Binding compile failed'}
          & $dxc -T lib_6_3 -HV 2018 -WX src/shaders/gi_auto_raygen.hlsl -Fo gi-auto-raygen.dxil
          if($LASTEXITCODE -ne 0) {throw 'Auto raygen compile failed'}
          & $dxc -T cs_6_0 -E main -HV 2018 -WX src/shaders/gi_auto_lighting.hlsl -Fo gi-auto-lighting.dxil
          if($LASTEXITCODE -ne 0) {throw 'Auto evaluator compile failed'}
          & $dxc -T cs_6_0 -E main -HV 2018 -WX tools/gi-auto-sample-validation.hlsl -Fo gi-auto-sample.dxil
          if($LASTEXITCODE -ne 0) {throw 'Auto sampler compile failed'}
      - name: Validate GPU targets and pilot resolve
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%I"
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-gi-auto-target-gpu.cpp /Fetest-gi-auto-target-gpu.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1
          test-gi-auto-target-gpu.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-gi-pilot-guide-resolve.cpp /Fetest-gi-pilot-guide-resolve.exe
          if errorlevel 1 exit /b 1
          test-gi-pilot-guide-resolve.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-gi-auto-binding-gpu.cpp /Fetest-gi-auto-binding-gpu.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1
          test-gi-auto-binding-gpu.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-gi-auto-sample-gpu.cpp /Fetest-gi-auto-sample-gpu.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1
          test-gi-auto-sample-gpu.exe
          if errorlevel 1 exit /b 1
