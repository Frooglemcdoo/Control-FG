name: Validate GI modernization foundation
on:
  push:
    branches: [work/gi-modernization]
  workflow_dispatch:
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned RTXDI shader library
        shell: powershell
        run: |
          git clone https://github.com/NVIDIA-RTX/RTXDI-Library.git .validation-rtxdi
          if ($LASTEXITCODE -ne 0) { throw 'RTXDI clone failed' }
          git -C .validation-rtxdi checkout f12037fa8e97ebc08e9e3edfd2de528ed1772a4b
          if ($LASTEXITCODE -ne 0) { throw 'RTXDI revision unavailable' }
      - name: CPU and GPU initial sample adapter
        shell: powershell
        run: |
          $vs=& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dxc=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$dxc) { throw 'Windows SDK DXC not found' }
          & $dxc.FullName -T cs_6_0 -E main -WX src/shaders/gi_initial_sample.hlsl -Fo gi-initial.dxil
          if ($LASTEXITCODE -ne 0) { throw 'Initial shader compile failed' }
          & $dxc.FullName -T cs_6_0 -E main -WX -I .validation-rtxdi/Include src/shaders/gi_rtxdi_initial.hlsl -Fo gi-rtxdi.dxil
          if ($LASTEXITCODE -ne 0) { throw 'RTXDI shader compile failed' }
          $commands=@"
          call "$vs\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-gi-geometry-metadata.cpp /Fe:gi-geometry-metadata.exe
          if not "%errorlevel%"=="0" exit /b 1
          gi-geometry-metadata.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-gi-submission-ledger.cpp /Fe:gi-submission-ledger.exe
          if not "%errorlevel%"=="0" exit /b 1
          gi-submission-ledger.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-gi-d3d12-geometry.cpp /Fe:gi-d3d12-geometry.exe
          if not "%errorlevel%"=="0" exit /b 1
          gi-d3d12-geometry.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-gi-buffer-index.cpp /Fe:gi-buffer-index.exe
          if not "%errorlevel%"=="0" exit /b 1
          gi-buffer-index.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-gi-submission-runtime.cpp /Fe:gi-submission-runtime.exe /link d3d12.lib dxgi.lib
          if not "%errorlevel%"=="0" exit /b 1
          gi-submission-runtime.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-gi-geometry-probe.cpp /Fe:gi-geometry-probe.exe
          if not "%errorlevel%"=="0" exit /b 1
          gi-geometry-probe.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-gi-initial-sample.cpp /Fe:gi-initial-cpu.exe
          if not "%errorlevel%"=="0" exit /b 1
          gi-initial-cpu.exe
          if not "%errorlevel%"=="0" exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /WX tools\test-gi-initial-gpu.cpp /Fe:gi-initial-gpu.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if not "%errorlevel%"=="0" exit /b 1
          gi-initial-gpu.exe gi-initial.dxil initial
          if not "%errorlevel%"=="0" exit /b 1
          gi-initial-gpu.exe gi-rtxdi.dxil rtxdi
          if not "%errorlevel%"=="0" exit /b 1
          "@
          $commands | Set-Content run-gi-validation.cmd
          cmd /c run-gi-validation.cmd
          if ($LASTEXITCODE -ne 0) { throw 'GI adapter validation failed' }
