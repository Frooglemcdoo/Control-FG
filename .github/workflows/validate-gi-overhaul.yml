name: Validate GI overhaul foundation
on:
  push:
    branches: [work/gi-scene-capture-r480]
  workflow_dispatch:
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and execute regional lookup on CPU and WARP
        shell: pwsh
        run: |
          $dxc=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter dxc.exe -Recurse | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $dxc){throw 'DXC unavailable'}
          & $dxc.FullName -T cs_6_0 -E main -WX tools/gi-regional-target-validation.hlsl -Fo gi-regional-target-validation.dxil
          if($LASTEXITCODE -ne 0){throw 'Shader compile failed'}
          cl /nologo /EHsc /std:c++17 /W4 /WX /O2 tools/test-gi-regional-target-lookup.cpp /Fe:regional-cpu.exe
          if($LASTEXITCODE -ne 0){throw 'CPU compile failed'}
          ./regional-cpu.exe
          if($LASTEXITCODE -ne 0){throw 'CPU validation failed'}
          cl /nologo /EHsc /std:c++17 /W4 /WX /O2 tools/test-gi-regional-target-gpu.cpp /Fe:regional-gpu.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if($LASTEXITCODE -ne 0){throw 'GPU compile failed'}
          ./regional-gpu.exe
          if($LASTEXITCODE -ne 0){throw 'GPU validation failed'}
          python tools/audit-gi-hit-writer.py --dxc $dxc.FullName --output hit-writer-audit.json
          if($LASTEXITCODE -ne 0){throw 'Hit writer audit failed'}
          foreach($entry in @('Clear','Claim','First','Second','Freeze')) {
            & $dxc.FullName -T cs_6_0 -E $entry -WX src/shaders/gi_regional_target_build.hlsl -Fo "regional-$entry.dxil"
            if($LASTEXITCODE -ne 0){throw "Regional compile failed: $entry"}
          }
          & $dxc.FullName -T cs_6_0 -E main -WX tools/gi-regional-pack-validation.hlsl -Fo gi-regional-pack-validation.dxil
          if($LASTEXITCODE -ne 0){throw 'Regional pack shader failed'}
          cl /nologo /EHsc /std:c++17 /W4 /WX /O2 tools/test-gi-regional-build-gpu.cpp /Fe:regional-build.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if($LASTEXITCODE -ne 0){throw 'Regional build fixture compile failed'}
          ./regional-build.exe
          if($LASTEXITCODE -ne 0){throw 'Regional build fixture failed'}
          ./regional-build.exe --stress
          if($LASTEXITCODE -ne 0){throw 'Regional 65535-record contention stress failed'}
          python tools/build-gi-auto.py --regional --dxc $dxc.FullName --output regional-compiled
          if($LASTEXITCODE -ne 0){throw 'Integrated regional shaders failed'}
          cl /nologo /EHsc /std:c++17 /W4 /WX /O2 /DCONTROL_GI_REGIONAL tools/test-gi-auto-record-gpu.cpp /Fe:regional-record.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if($LASTEXITCODE -ne 0){throw 'Regional record compile failed'}
          ./regional-record.exe
          if($LASTEXITCODE -ne 0){throw 'Regional record fixture failed'}
      - name: Validate defensive sampling energy and uncovered-source tails
        shell: pwsh
        run: |
          $dxc=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter dxc.exe -Recurse | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          & $dxc.FullName -T cs_6_0 -E main -WX tools/gi-auto-sample-validation.hlsl -Fo gi-auto-sample.dxil
          if($LASTEXITCODE -ne 0){throw 'Sampler compile failed'}
          cl /nologo /EHsc /std:c++17 /W4 /WX /O2 tools/test-gi-auto-sample-gpu.cpp /Fe:auto-sample.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if($LASTEXITCODE -ne 0){throw 'Sampler fixture compile failed'}
          ./auto-sample.exe
          if($LASTEXITCODE -ne 0){throw 'Sampler validation failed'}
      - name: Validate scene capture keeps owned GI active
        shell: cmd
        run: |
          cl /nologo /EHsc /std:c++17 /W4 /WX tools\test-diagnostic-activity.cpp /Fe:scene-activity.exe
          if errorlevel 1 exit /b 1
          scene-activity.exe
          if errorlevel 1 exit /b 1
      - name: Validate secondary filter patch scope
        shell: cmd
        run: python tools/test-gi-secondary-filter.py
      - name: Validate exact producer weight transport
        shell: pwsh
        run: |
          $dxc=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter dxc.exe -Recurse | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          & $dxc.FullName -T cs_6_0 -E main -D PRODUCER=1 -WX tools/gi-weight-transport-validation.hlsl -Fo weight-write.dxil
          if($LASTEXITCODE -ne 0){throw 'Producer compile failed'}
          & $dxc.FullName -T cs_6_0 -E main -WX tools/gi-weight-transport-validation.hlsl -Fo weight-read.dxil
          if($LASTEXITCODE -ne 0){throw 'Consumer compile failed'}
          cl /nologo /EHsc /std:c++17 /W4 /WX /O2 /DCONTROL_GI_REGIONAL tools/test-gi-weight-transport.cpp /Fe:weight-transport.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if($LASTEXITCODE -ne 0){throw 'Weight fixture compile failed'}
          ./weight-transport.exe
          if($LASTEXITCODE -ne 0){throw 'Weight fixture failed'}
      - name: Validate texture probe against known mip colors and sampler clamps
        shell: pwsh
        run: |
          $dxc=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter dxc.exe -Recurse | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          & $dxc.FullName -T cs_6_0 -E main -WX tools/gi-texture-probe-validation.hlsl -Fo texture-probe.dxil
          if($LASTEXITCODE -ne 0){throw 'Texture probe shader failed'}
          cl /nologo /EHsc /std:c++17 /W4 /WX /O2 tools/test-gi-texture-probe.cpp /Fe:texture-probe.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if($LASTEXITCODE -ne 0){throw 'Texture probe fixture failed'}
          ./texture-probe.exe
          if($LASTEXITCODE -ne 0){throw 'Texture probe GPU test failed'}
      - name: Validate full-screen grid and lossless split packaging
        shell: pwsh
        run: |
          cl /nologo /EHsc /std:c++17 /W4 /WX /O2 tools/test-gi-scene-grid.cpp /Fe:scene-grid.exe
          if($LASTEXITCODE -ne 0){throw 'Scene grid compile failed'}
          ./scene-grid.exe
          if($LASTEXITCODE -ne 0){throw 'Scene grid failed'}
          python tools/test-gi-scene-package.py
          if($LASTEXITCODE -ne 0){throw 'Scene package validation failed'}
      - name: Verify secondary translation and observation hooks
        shell: pwsh
        run: |
          python tools/test-gi-secondary.py
          if($LASTEXITCODE -ne 0){throw 'Secondary instruction preservation failed'}
      - name: Validate red trace packing and independent red selection
        shell: pwsh
        run: |
          $dxc=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter dxc.exe -Recurse | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          & $dxc.FullName -T cs_6_0 -E main -WX tools/gi-red-trace-validation.hlsl -Fo gi-red-trace-validation.dxil
          if($LASTEXITCODE -ne 0){throw 'Red trace shader failed'}
          cl /nologo /EHsc /std:c++17 /W4 /WX /O2 tools/test-gi-red-trace-gpu.cpp /Fe:red-trace.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if($LASTEXITCODE -ne 0){throw 'Red trace fixture failed'}
          ./red-trace.exe
          if($LASTEXITCODE -ne 0){throw 'Red trace GPU validation failed'}
          cl /nologo /EHsc /std:c++17 /W4 /WX /O2 tools/test-gi-auto-pixel-summary.cpp /Fe:red-select.exe
          if($LASTEXITCODE -ne 0){throw 'Red selection compile failed'}
          ./red-select.exe
          if($LASTEXITCODE -ne 0){throw 'Red selection validation failed'}
      - name: Validate actual producer packet capture on WARP
        shell: pwsh
        run: |
          $dxc=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter dxc.exe -Recurse | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          & $dxc.FullName -T cs_6_0 -E main -WX tools/gi-producer-packet-validation.hlsl -Fo gi-producer-packet-validation.dxil
          if($LASTEXITCODE -ne 0){throw 'Producer packet shader failed'}
          cl /nologo /EHsc /std:c++17 /W4 /WX /DCONTROL_GI_REGIONAL tools/test-gi-producer-packet.cpp /Fe:producer-packet.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if($LASTEXITCODE -ne 0){throw 'Producer packet fixture compile failed'}
          ./producer-packet.exe
          if($LASTEXITCODE -ne 0){throw 'Producer packet fixture failed'}
      - name: Validate GPU fault observer with live WARP device
        shell: cmd
        run: |
          cl /nologo /EHsc /std:c++17 /W4 /WX /O2 tools/test-gi-gpu-fault.cpp /Fe:gpu-fault.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1
          gpu-fault.exe
          if errorlevel 1 exit /b 1
