name: Package Texture Experimental R2 source

on:
  push:
    branches:
      - feature/texture-streaming-experimental-r2
    paths:
      - ".github/workflows/package-source-r2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c7af407a8946c1ad7fc91b5b2a622a528c47bf65
          fetch-depth: 1
      - name: Archive exact pushed source
        run: |
          git archive --format=zip \
            --prefix=Control-FG-v2.1.1-Texture-Experimental-R2-Source/ \
            -o Control-FG-v2.1.1-Texture-Experimental-R2-Source.zip HEAD
          sha256sum Control-FG-v2.1.1-Texture-Experimental-R2-Source.zip > Control-FG-v2.1.1-Texture-Experimental-R2-Source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Control-FG-v2.1.1-Texture-Experimental-R2-Source
          path: |
            Control-FG-v2.1.1-Texture-Experimental-R2-Source.zip
            Control-FG-v2.1.1-Texture-Experimental-R2-Source.sha256
          if-no-files-found: error
          retention-days: 7
