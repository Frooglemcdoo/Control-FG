name: Build GI visibility integration test
on:
  push:
    branches: [work/gi-modernization]
    paths:
      - src/gi_reuse/visibility.h
      - src/gi_reuse/d3d12_visibility_pipeline.h
      - src/gi_reuse/receiver_input.h
      - src/gi_reuse/reuse_candidate.h
      - src/shaders/gi_connection_visibility.hlsl
      - src/shaders/gi_receiver_shading.hlsl
      - tools/test-gi-visibility-gpu.cpp
      - tools/gi-visibility-test/**
      - .github/workflows/gi-visibility-backend.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native and fixture variants
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $vs=& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dxc=Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$dxc -or !$vs) { throw 'Compiler unavailable' }
          New-Item -ItemType Directory -Force package | Out-Null
          & $dxc.FullName -T lib_6_3 -WX -D GI_NATIVE_VISIBILITY_BINDINGS=1 src/shaders/gi_connection_visibility.hlsl -Fo gi-visibility-native.dxil
          if ($LASTEXITCODE -ne 0) { throw 'Native-root shader compile failed' }
          & $dxc.FullName -T lib_6_3 -WX -D GI_VISIBILITY_FIXTURE=1 src/shaders/gi_connection_visibility.hlsl -Fo package/gi-visibility-fixture.dxil
          if ($LASTEXITCODE -ne 0) { throw 'Fixture shader compile failed' }
          & $dxc.FullName -T cs_6_0 -E main -WX src/shaders/gi_receiver_shading.hlsl -Fo package/gi-receiver-shading.dxil
          if ($LASTEXITCODE -ne 0) { throw 'Receiver shader compile failed' }
          $commands=@"
          call "$vs\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 /MT tools\test-gi-visibility-gpu.cpp /Fe:package\GI-Backend-Test.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          exit /b %errorlevel%
          "@
          [IO.File]::WriteAllText("$pwd/compile-gi-backend.cmd",$commands)
          cmd /c compile-gi-backend.cmd
          if ($LASTEXITCODE -ne 0) { throw 'GPU executable compile failed' }
      - name: Package hardware test
        shell: powershell
        run: |
          Copy-Item tools/gi-visibility-test/* package
          Compress-Archive -Path package/* -DestinationPath Control-GI-Backend-Test.zip
          (Get-FileHash Control-GI-Backend-Test.zip -Algorithm SHA256).Hash | Set-Content Control-GI-Backend-Test.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Control-GI-Backend-Test
          path: |
            Control-GI-Backend-Test.zip
            Control-GI-Backend-Test.sha256
