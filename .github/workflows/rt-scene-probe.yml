name: Build RT scene query probe
on:
  push:
    branches: [work/rt-replacement-r392]
    paths: ['tools/rt-scene-probe/**', '.github/workflows/rt-scene-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile read-only probe
        shell: pwsh
        run: |
          cmake -S tools/rt-scene-probe -B build-scene-probe -A x64
          if ($LASTEXITCODE) { throw 'Configure failed' }
          cmake --build build-scene-probe --config Release
          if ($LASTEXITCODE) { throw 'Build failed' }
          & build-scene-probe/Release/Control-RT-Scene-Probe.exe
          if ($LASTEXITCODE -ne 1) { throw 'Missing-game smoke test did not reject' }
          if (!(Select-String -Path RT-Scene-Probe.txt -SimpleMatch 'Start Control DX12 and load into gameplay first')) { throw 'Unexpected smoke-test failure' }
          New-Item -ItemType Directory -Force scene-probe-package | Out-Null
          Copy-Item build-scene-probe/Release/Control-RT-Scene-Probe.exe,tools/rt-scene-probe/Run-RT-Scene-Probe.cmd,tools/rt-scene-probe/README.txt scene-probe-package
          git rev-parse HEAD | Set-Content scene-probe-package/source-commit.txt
          Get-ChildItem scene-probe-package -File | Get-FileHash -Algorithm SHA256 | Select-Object Hash,Path | ConvertTo-Json | Set-Content scene-probe-package/SHA256.json
      - uses: actions/upload-artifact@v4
        with:
          name: Control-RT-Scene-Probe
          path: scene-probe-package/
          if-no-files-found: error
