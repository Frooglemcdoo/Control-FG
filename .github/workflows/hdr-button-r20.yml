name: HDR Null Tags R36 Windows build
on:
  push:
    branches: ['diag/rtx50-hdr-null-tags-r36']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TsudaKageyu/minhook
          ref: v1.3.4
          path: diagnostics/hdr-button-r20/third_party/minhook
      - name: Prepare exact public v2 package
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://github.com/Frooglemcdoo/Control-FG/releases/download/v2.0.0/Control-FG-v2.0.0.zip' -OutFile baseline.zip
          python diagnostics/hdr-button-r20/tools/prepare.py baseline.zip diagnostics/hdr-button-r20/package
          if ($LASTEXITCODE -ne 0) { throw 'prepare failed' }
          python -m pip -q install pefile
          python -c "import pefile; p=pefile.PE('diagnostics/hdr-button-r20/package/dxgi.dll'); d={x.dll:[y.name for y in x.imports] for x in p.DIRECTORY_ENTRY_IMPORT}; print(d); assert b'ControlFGHDRButton_Bootstrap' in d[b'ControlFGHDRButton.dll']"
          if ($LASTEXITCODE -ne 0) { throw 'PE import validation failed' }
      - name: R36 architecture and lifecycle policy assertions
        run: |
          $ErrorActionPreference='Stop'
          $guard=Get-Content diagnostics/hdr-button-r20/src/guard.cpp -Raw
          $transition=Get-Content diagnostics/hdr-button-r20/src/transition.h -Raw
          foreach($forbidden in @('SendInput','WriteTransitionFgHold','shieldWindow','VK_LWIN','VK_LMENU','HookedUiRecomposeTag','R31_HDR_INPUT_PATH','R31A_HDR_INPUT_PATH','HookedEnsureRecomposeSlot','kFreshDomainFramesRequired = 12','WriteFGSelectionRaw(0')) {
            if($guard.Contains($forbidden)) { throw "R36 forbidden mechanism remains: $forbidden" }
          }
          foreach($required in @('DisplayConfigSetDeviceInfo','beginHdrHardReset','originalBeginHdrHardReset','HookedBeginHdrHardReset','R36_OVERLAP_RESET_REBASE','R36_HARD_RESET_CONFIRMED','PatchThreeFrameTransitionWarmup','R36_TRANSITION_POLICY','R36_FG_REARM_WAIT','InvalidateStreamlineRecompositionTags','R36_SL_TAG_INVALIDATE','R36_SL_TAG_API_READY','kBufferTypeHUDLessColor=2','kBufferTypeUIColorAndAlpha=23','kBufferTypeUIAlpha=69','kResourceLifecycleValidUntilPresent=1','sizeof(SlResourceTagRaw)==64','kRvaBridgeGeneration = 0xABD50','kRvaSettledBridgeGeneration = 0xABBF0','kRvaHdrHardResetResetBridgeGeneration = 0xABC58','failure_unwind_restore_saved_selection','HDR_BUTTON_FG_RESUMED')) {
            if(-not $guard.Contains($required)) { throw "R36 required lifecycle mechanism missing: $required" }
          }
          foreach($required in @('kTransitionTimeoutMs = 60000','kFreshDomainFramesRequired = 3','ThirtySecondStallIsSafe')) {
            if(-not $transition.Contains($required)) { throw "R36 transition contract missing: $required" }
          }
          @'
          import pefile
          p=pefile.PE('diagnostics/hdr-button-r20/package/dxgi.dll')
          image=bytes(p.__data__)
          checks={
              0x0CDC0: bytes.fromhex('48 89 6C 24 20 56 48 83 EC 30'),
              0x414B4: bytes.fromhex('83 F9 02'),
              0x41513: bytes.fromhex('C7 44 24 20 02 00 00 00'),
              0x41569: bytes.fromhex('41 83 FE 02'),
              0x4169B: bytes.fromhex('83 F9 02'),
              0x41742: bytes.fromhex('41 83 FF 02'),
          }
          for rva,expected in checks.items():
              off=p.get_offset_from_rva(rva)
              actual=image[off:off+len(expected)]
              assert actual==expected,(hex(rva),actual.hex(),expected.hex())
          print('PASS R36 hard-reset and three-frame patch signatures')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'R36 binary signature validation failed' }
          Write-Host 'PASS R36 policy: R33 full recomposition retained; current-frame HUDless/UI Streamline tags are explicitly nulled before each DLSS-G hard reset.'
      - name: Compile MSVC Release
        run: |
          cmake -S diagnostics/hdr-button-r20 -B diagnostics/hdr-button-r20/build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          cmake --build diagnostics/hdr-button-r20/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
      - name: Unit and loader tests
        run: |
          ctest --test-dir diagnostics/hdr-button-r20/build -C Release --output-on-failure --verbose
          if ($LASTEXITCODE -ne 0) { throw 'ctest failed' }
      - name: Assemble and smoke-test package
        run: |
          $ErrorActionPreference='Stop'
          $root='diagnostics/hdr-button-r20'
          Copy-Item "$root/build/Release/ControlFGHDRButton.dll" "$root/package/ControlFGHDRButton.dll"
          Copy-Item "$root/third_party/minhook/LICENSE.txt" "$root/package/legal/MINHOOK-LICENSE.txt"
          & "$root/build/Release/core_load_test.exe" (Resolve-Path "$root/package/dxgi.dll").Path
          if ($LASTEXITCODE -ne 0) { throw 'core/helper hook smoke test failed' }
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "$root/package/Collect-ControlFG-Compact-Logs.ps1").Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; throw 'collector syntax failure' }
          Get-FileHash "$root/package/dxgi.dll","$root/package/ControlFGHDRButton.dll" -Algorithm SHA256 | Format-Table -AutoSize
      - name: Add test notes
        run: |
          @'
          CONTROL FG RTX50 HDR NULL TAGS R36 TEST

          R36 returns to the R33 full-quality path:
          - original HUDless + UI-alpha recomposition;
          - three fresh destination-domain frames before rearm;
          - real slFreeResources(DLSS-G) hard reset;
          - R33 overlap/refree protection.

          R34 forced slot recreation and R35 twelve-frame waiting are removed.

          New R36 behavior:
          immediately before each DLSS-G HDR-domain hard reset, R36 resolves the official Streamline frame APIs and explicitly sets the current frame's recomposition tags to null:
          - HUDLessColor (2) = null
          - UIColorAndAlpha (23) = null
          - UIAlpha (69) = null

          All three null tags use eValidUntilPresent and a null command buffer, matching the Streamline API contract for null/eValidUntilPresent tags.

          This releases Streamline's retained references to the old-domain recomposition resources BEFORE slFreeResources(DLSS-G) and before the HDR/SDR swapchain resources are replaced.

          Expected at each transition:
          R36_SL_TAG_API_READY (first transition only)
          R36_SL_TAG_INVALIDATE ... success=1 hudless=null ui_color_alpha=null ui_alpha=null
          FG_HDR_HARD_RESET_FREE ... success=1
          FG_HDR_TRANSITION_SETTLED
          HDR_BUTTON_FG_RESUMED

          Test repeated 2x SDR <-> HDR switching. Jesse/HUD quality should remain the normal full-recomposition quality.
          '@ | Set-Content diagnostics/hdr-button-r20/package/HDR-BUTTON-R36-TEST.txt -Encoding UTF8
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: Control-FG-RTX50-HDR-Null-Tags-R36
          path: diagnostics/hdr-button-r20/package/
          retention-days: 7
          if-no-files-found: error
