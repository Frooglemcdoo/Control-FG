name: HDR Final Color R31A Windows build
on:
  push:
    branches: ['diag/rtx50-hdr-final-color-r31a']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TsudaKageyu/minhook
          ref: v1.3.4
          path: diagnostics/hdr-button-r20/third_party/minhook
      - name: Prepare exact public v2 package
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://github.com/Frooglemcdoo/Control-FG/releases/download/v2.0.0/Control-FG-v2.0.0.zip' -OutFile baseline.zip
          python diagnostics/hdr-button-r20/tools/prepare.py baseline.zip diagnostics/hdr-button-r20/package
          if ($LASTEXITCODE -ne 0) { throw 'prepare failed' }
          python -m pip -q install pefile
          python -c "import pefile; p=pefile.PE('diagnostics/hdr-button-r20/package/dxgi.dll'); d={x.dll:[y.name for y in x.imports] for x in p.DIRECTORY_ENTRY_IMPORT}; print(d); assert b'ControlFGHDRButton_Bootstrap' in d[b'ControlFGHDRButton.dll']"
          if ($LASTEXITCODE -ne 0) { throw 'PE import validation failed' }
      - name: R31A architecture and HDR-input policy assertions
        run: |
          $ErrorActionPreference='Stop'
          $guard=Get-Content diagnostics/hdr-button-r20/src/guard.cpp -Raw
          $transition=Get-Content diagnostics/hdr-button-r20/src/transition.h -Raw
          foreach($forbidden in @('SendInput','WriteTransitionFgHold','shieldWindow','beginHdrHardReset','VK_LWIN','VK_LMENU')) {
            if($guard.Contains($forbidden)) { throw "R31A forbidden legacy mechanism remains: $forbidden" }
          }
          foreach($required in @('DisplayConfigSetDeviceInfo','WriteFGSelectionRaw(0','FailTransitionAndRestoreFG','failure_unwind_restore_saved_selection','HDR_BUTTON_FG_RESUMED')) {
            if(-not $guard.Contains($required)) { throw "R31A required mechanism missing: $required" }
          }
          if(-not $transition.Contains('kTransitionTimeoutMs = 60000')) { throw 'R31A timeout contract missing' }
          if(-not $transition.Contains('ThirtySecondStallIsSafe')) { throw 'R31A 30-second stall contract missing' }
          foreach($required in @('HookedUiRecomposeTag','R31A_HDR_INPUT_PATH','kRvaUiRecomposeTagFn = 0x1A9D0','kRvaHdrDlssgOptionsPatch = 0x4196F','kRvaHdrFreshHudlessFormatCmp = 0x4129F','kRvaHdrFreshTagMaskAnd = 0x412E2','kRvaHdrFreshTagMaskCmp = 0x412EC','optionsReplacement','transition_required_mask=0x3','transition_hudless_format=0')) {
            if(-not $guard.Contains($required)) { throw "R31A HDR input mechanism missing: $required" }
          }
          @'
          import pefile
          p=pefile.PE('diagnostics/hdr-button-r20/package/dxgi.dll')
          image=bytes(p.__data__)
          checks={
              0x1A9D0: bytes.fromhex('40 55 53 56 57 41 54 41 55 41 56 41 57 48 8D AC'),
              0x4196F: bytes.fromhex('41 8B C7 F7 D8 1B C9 83 E1 18 89 4D 24'),
              0x4129F: bytes.fromhex('41 83 FF 18'),
              0x412E2: bytes.fromhex('83 E0 0C'),
              0x412EC: bytes.fromhex('83 F8 0C'),
          }
          for rva,expected in checks.items():
              off=p.get_offset_from_rva(rva)
              actual=image[off:off+len(expected)]
              assert actual==expected,(hex(rva),actual.hex(),expected.hex())
          print('PASS R31A binary patch signatures')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'R31A binary signature validation failed' }
          Write-Host 'PASS R31A policy: R30 transition frozen; HDR DLSS-G final-color-only; SDR recomposition preserved.'
      - name: Compile MSVC Release
        run: |
          cmake -S diagnostics/hdr-button-r20 -B diagnostics/hdr-button-r20/build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          cmake --build diagnostics/hdr-button-r20/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
      - name: Unit and loader tests
        run: |
          ctest --test-dir diagnostics/hdr-button-r20/build -C Release --output-on-failure --verbose
          if ($LASTEXITCODE -ne 0) { throw 'ctest failed' }
      - name: Assemble and smoke-test package
        run: |
          $ErrorActionPreference='Stop'
          $root='diagnostics/hdr-button-r20'
          Copy-Item "$root/build/Release/ControlFGHDRButton.dll" "$root/package/ControlFGHDRButton.dll"
          Copy-Item "$root/third_party/minhook/LICENSE.txt" "$root/package/legal/MINHOOK-LICENSE.txt"
          & "$root/build/Release/core_load_test.exe" (Resolve-Path "$root/package/dxgi.dll").Path
          if ($LASTEXITCODE -ne 0) { throw 'core/helper hook smoke test failed' }
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "$root/package/Collect-ControlFG-Compact-Logs.ps1").Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; throw 'collector syntax failure' }
          Get-FileHash "$root/package/dxgi.dll","$root/package/ControlFGHDRButton.dll" -Algorithm SHA256 | Format-Table -AutoSize
      - name: Add test notes
        run: |
          @'
          CONTROL FG RTX50 HDR FINAL COLOR R31A A/B TEST

          Open the F10 overlay. A new HDR ON / HDR OFF button appears in the HDR status column near the top of the F10 overlay.

          Clicking it performs:
          1. save the user's current FG selection;
          2. change the actual FG selection to Off and wait until DLSS-G reports API Off;
          3. toggle Windows HDR directly with DisplayConfigSetDeviceInfo (no Win+Alt+B injection);
          4. apply Control's native HDR state and let the existing core own the swap-chain/bridge transition;
          5. wait for the requested Windows + Control + bridge domain and two fresh AA/render frames;
          6. restore the exact saved FG selection and confirm DLSS-G re-engages.

          R31A leaves the R30 HDR transition state machine unchanged.

          HDR-only A/B change:
          - no HDR HUDless tag;
          - no HDR UI-alpha tag;
          - hudLessBufferFormat = 0;
          - uiBufferFormat = 0;
          - enableUserInterfaceRecomposition = false;
          - DLSS-G receives final RGB10/PQ color + depth + motion vectors only.

          SDR retains the existing HUDless/UI recomposition path unchanged.

          Expected R31A log while HDR + FG is active:
          R31A_HDR_INPUT_PATH ... mode=final_color_only ... hudless_tag=0 ui_alpha_tag=0 ui_recomposition=0
          FG_UI_RECOMPOSITION_OPTIONS ... enabled=0 hudless_tag=0 ui_alpha_tag=0 ... hdr10_bridge=1
          SL_DLSSG_MODE ... mode=on ... color_fmt=24 hudless_fmt=0 hdr10_bridge=1

          RTX50 diagnostic only.
          '@ | Set-Content diagnostics/hdr-button-r20/package/HDR-BUTTON-R31A-TEST.txt -Encoding UTF8
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: Control-FG-RTX50-HDR-Final-Color-R31A
          path: diagnostics/hdr-button-r20/package/
          retention-days: 7
          if-no-files-found: error
