name: HDR Recompose Rebuild R34 Windows build
on:
  push:
    branches: ['diag/rtx50-hdr-recompose-rebuild-r34']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TsudaKageyu/minhook
          ref: v1.3.4
          path: diagnostics/hdr-button-r20/third_party/minhook
      - name: Prepare exact public v2 package
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://github.com/Frooglemcdoo/Control-FG/releases/download/v2.0.0/Control-FG-v2.0.0.zip' -OutFile baseline.zip
          python diagnostics/hdr-button-r20/tools/prepare.py baseline.zip diagnostics/hdr-button-r20/package
          if ($LASTEXITCODE -ne 0) { throw 'prepare failed' }
          python -m pip -q install pefile
          python -c "import pefile; p=pefile.PE('diagnostics/hdr-button-r20/package/dxgi.dll'); d={x.dll:[y.name for y in x.imports] for x in p.DIRECTORY_ENTRY_IMPORT}; print(d); assert b'ControlFGHDRButton_Bootstrap' in d[b'ControlFGHDRButton.dll']"
          if ($LASTEXITCODE -ne 0) { throw 'PE import validation failed' }
      - name: R34 architecture and lifecycle policy assertions
        run: |
          $ErrorActionPreference='Stop'
          $guard=Get-Content diagnostics/hdr-button-r20/src/guard.cpp -Raw
          $transition=Get-Content diagnostics/hdr-button-r20/src/transition.h -Raw
          foreach($forbidden in @('SendInput','WriteTransitionFgHold','shieldWindow','VK_LWIN','VK_LMENU','HookedUiRecomposeTag','R31_HDR_INPUT_PATH','R31A_HDR_INPUT_PATH','WriteFGSelectionRaw(0')) {
            if($guard.Contains($forbidden)) { throw "R34 forbidden mechanism remains: $forbidden" }
          }
          foreach($required in @('DisplayConfigSetDeviceInfo','beginHdrHardReset','originalBeginHdrHardReset','HookedBeginHdrHardReset','R34_OVERLAP_RESET_REBASE','R34_HARD_RESET_CONFIRMED','PatchThreeFrameTransitionWarmup','R34_TRANSITION_POLICY','R34_FG_REARM_WAIT','HookedEnsureRecomposeSlot','R34_RECOMPOSE_SLOT_INVALIDATE','R34_RECOMPOSE_SLOT_REBUILT','kRvaEnsureRecomposeSlot = 0x197C0','kRvaBridgeGeneration = 0xABD50','kRvaSettledBridgeGeneration = 0xABBF0','kRvaHdrHardResetResetBridgeGeneration = 0xABC58','failure_unwind_restore_saved_selection','HDR_BUTTON_FG_RESUMED')) {
            if(-not $guard.Contains($required)) { throw "R34 required lifecycle mechanism missing: $required" }
          }
          foreach($required in @('kTransitionTimeoutMs = 60000','kFreshDomainFramesRequired = 3','ThirtySecondStallIsSafe')) {
            if(-not $transition.Contains($required)) { throw "R34 transition contract missing: $required" }
          }
          @'
          import pefile
          p=pefile.PE('diagnostics/hdr-button-r20/package/dxgi.dll')
          image=bytes(p.__data__)
          checks={
              0x0CDC0: bytes.fromhex('48 89 6C 24 20 56 48 83 EC 30'),
              0x197C0: bytes.fromhex('40 55 53 56 57 41 54 41 55 41 56 41 57 48 8D AC'),
              0x414B4: bytes.fromhex('83 F9 02'),
              0x41513: bytes.fromhex('C7 44 24 20 02 00 00 00'),
              0x41569: bytes.fromhex('41 83 FE 02'),
              0x4169B: bytes.fromhex('83 F9 02'),
              0x41742: bytes.fromhex('41 83 FF 02'),
          }
          for rva,expected in checks.items():
              off=p.get_offset_from_rva(rva)
              actual=image[off:off+len(expected)]
              assert actual==expected,(hex(rva),actual.hex(),expected.hex())
          print('PASS R34 hard-reset and three-frame patch signatures')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'R34 binary signature validation failed' }
          Write-Host 'PASS R34 policy: full recomposition preserved; destination SDR/HDR three-slot recomposition bank is force-rebuilt once per display-domain generation.'
      - name: Compile MSVC Release
        run: |
          cmake -S diagnostics/hdr-button-r20 -B diagnostics/hdr-button-r20/build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          cmake --build diagnostics/hdr-button-r20/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
      - name: Unit and loader tests
        run: |
          ctest --test-dir diagnostics/hdr-button-r20/build -C Release --output-on-failure --verbose
          if ($LASTEXITCODE -ne 0) { throw 'ctest failed' }
      - name: Assemble and smoke-test package
        run: |
          $ErrorActionPreference='Stop'
          $root='diagnostics/hdr-button-r20'
          Copy-Item "$root/build/Release/ControlFGHDRButton.dll" "$root/package/ControlFGHDRButton.dll"
          Copy-Item "$root/third_party/minhook/LICENSE.txt" "$root/package/legal/MINHOOK-LICENSE.txt"
          & "$root/build/Release/core_load_test.exe" (Resolve-Path "$root/package/dxgi.dll").Path
          if ($LASTEXITCODE -ne 0) { throw 'core/helper hook smoke test failed' }
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "$root/package/Collect-ControlFG-Compact-Logs.ps1").Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; throw 'collector syntax failure' }
          Get-FileHash "$root/package/dxgi.dll","$root/package/ControlFGHDRButton.dll" -Algorithm SHA256 | Format-Table -AutoSize
      - name: Add test notes
        run: |
          @'
          CONTROL FG RTX50 HDR RECOMPOSITION REBUILD R34 TEST

          R34 keeps the original full-quality HUDless + UI-alpha recomposition path.

          The R33 failure log proved HDR -> SDR was completing its DLSS-G hard reset normally, but the SDR recomposition bank was not rebuilt:
          - startup SDR created slot 0/1/2;
          - SDR -> HDR recreated HDR slot 0/1/2;
          - HDR -> SDR produced NO new SDR FG_UI_RECOMPOSE_SLOT_READY lines;
          - the old pre-HDR SDR bank was simply reused.

          R34 hooks the core recomposition-slot validator. On every new display-domain generation, each of the three destination-domain slots is deliberately invalidated once before validation. The core then uses its own normal release/recreate path for that slot.

          Expected on HDR -> SDR:
          R34_RECOMPOSE_SLOT_INVALIDATE ... domain=sdr slot=0/1/2
          FG_UI_RECOMPOSE_SLOT_READY ... hdr10=0   (three fresh slots)
          R34_RECOMPOSE_SLOT_REBUILT ... domain=sdr slot=0/1/2
          FG_HDR_TRANSITION_SETTLED ... fresh_frames=3
          HDR_BUTTON_FG_RESUMED

          Expected on SDR -> HDR:
          the same sequence with domain=hdr and core FG_UI_RECOMPOSE_SLOT_READY hdr10=1.

          R33 overlap-refree protection is retained.
          No final-color-only fallback, no gray shield, no Win+Alt+B injection, and user FG selection remains unchanged.

          Test 2x FG with repeated SDR <-> HDR switching and verify Jesse + HUD remain clean in both domains.
          '@ | Set-Content diagnostics/hdr-button-r20/package/HDR-BUTTON-R34-TEST.txt -Encoding UTF8
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: Control-FG-RTX50-HDR-Recompose-Rebuild-R34
          path: diagnostics/hdr-button-r20/package/
          retention-days: 7
          if-no-files-found: error
