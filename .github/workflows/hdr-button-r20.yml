name: HDR Stable Warmup R35 Windows build
on:
  push:
    branches: ['diag/rtx50-hdr-stable-warmup-r35']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TsudaKageyu/minhook
          ref: v1.3.4
          path: diagnostics/hdr-button-r20/third_party/minhook
      - name: Prepare exact public v2 package
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://github.com/Frooglemcdoo/Control-FG/releases/download/v2.0.0/Control-FG-v2.0.0.zip' -OutFile baseline.zip
          python diagnostics/hdr-button-r20/tools/prepare.py baseline.zip diagnostics/hdr-button-r20/package
          if ($LASTEXITCODE -ne 0) { throw 'prepare failed' }
          python -m pip -q install pefile
          python -c "import pefile; p=pefile.PE('diagnostics/hdr-button-r20/package/dxgi.dll'); d={x.dll:[y.name for y in x.imports] for x in p.DIRECTORY_ENTRY_IMPORT}; print(d); assert b'ControlFGHDRButton_Bootstrap' in d[b'ControlFGHDRButton.dll']"
          if ($LASTEXITCODE -ne 0) { throw 'PE import validation failed' }
      - name: R35 architecture and lifecycle policy assertions
        run: |
          $ErrorActionPreference='Stop'
          $guard=Get-Content diagnostics/hdr-button-r20/src/guard.cpp -Raw
          $transition=Get-Content diagnostics/hdr-button-r20/src/transition.h -Raw
          foreach($forbidden in @('SendInput','WriteTransitionFgHold','shieldWindow','VK_LWIN','VK_LMENU','HookedUiRecomposeTag','R31_HDR_INPUT_PATH','R31A_HDR_INPUT_PATH','WriteFGSelectionRaw(0')) {
            if($guard.Contains($forbidden)) { throw "R35 forbidden mechanism remains: $forbidden" }
          }
          foreach($required in @('DisplayConfigSetDeviceInfo','beginHdrHardReset','originalBeginHdrHardReset','HookedBeginHdrHardReset','R35_OVERLAP_RESET_REBASE','R35_HARD_RESET_CONFIRMED','PatchTwelveFrameTransitionWarmup','R35_TRANSITION_POLICY','R35_FG_REARM_WAIT','kRvaBridgeGeneration = 0xABD50','kRvaSettledBridgeGeneration = 0xABBF0','kRvaHdrHardResetResetBridgeGeneration = 0xABC58','failure_unwind_restore_saved_selection','HDR_BUTTON_FG_RESUMED')) {
            if(-not $guard.Contains($required)) { throw "R35 required lifecycle mechanism missing: $required" }
          }
          foreach($required in @('kTransitionTimeoutMs = 60000','kFreshDomainFramesRequired = 12','ThirtySecondStallIsSafe')) {
            if(-not $transition.Contains($required)) { throw "R35 transition contract missing: $required" }
          }
          @'
          import pefile
          p=pefile.PE('diagnostics/hdr-button-r20/package/dxgi.dll')
          image=bytes(p.__data__)
          checks={
              0x0CDC0: bytes.fromhex('48 89 6C 24 20 56 48 83 EC 30'),
              0x414B4: bytes.fromhex('83 F9 02'),
              0x41513: bytes.fromhex('C7 44 24 20 02 00 00 00'),
              0x41569: bytes.fromhex('41 83 FE 02'),
              0x4169B: bytes.fromhex('83 F9 02'),
              0x41742: bytes.fromhex('41 83 FF 02'),
          }
          for rva,expected in checks.items():
              off=p.get_offset_from_rva(rva)
              actual=image[off:off+len(expected)]
              assert actual==expected,(hex(rva),actual.hex(),expected.hex())
          print('PASS R35 hard-reset and twelve-frame patch signatures')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'R35 binary signature validation failed' }
          Write-Host 'PASS R35 policy: R33 full recomposition and overlap protection retained; FG rearm delayed until twelve fresh post-transition frames.'
      - name: Compile MSVC Release
        run: |
          cmake -S diagnostics/hdr-button-r20 -B diagnostics/hdr-button-r20/build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          cmake --build diagnostics/hdr-button-r20/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
      - name: Unit and loader tests
        run: |
          ctest --test-dir diagnostics/hdr-button-r20/build -C Release --output-on-failure --verbose
          if ($LASTEXITCODE -ne 0) { throw 'ctest failed' }
      - name: Assemble and smoke-test package
        run: |
          $ErrorActionPreference='Stop'
          $root='diagnostics/hdr-button-r20'
          Copy-Item "$root/build/Release/ControlFGHDRButton.dll" "$root/package/ControlFGHDRButton.dll"
          Copy-Item "$root/third_party/minhook/LICENSE.txt" "$root/package/legal/MINHOOK-LICENSE.txt"
          & "$root/build/Release/core_load_test.exe" (Resolve-Path "$root/package/dxgi.dll").Path
          if ($LASTEXITCODE -ne 0) { throw 'core/helper hook smoke test failed' }
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "$root/package/Collect-ControlFG-Compact-Logs.ps1").Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; throw 'collector syntax failure' }
          Get-FileHash "$root/package/dxgi.dll","$root/package/ControlFGHDRButton.dll" -Algorithm SHA256 | Format-Table -AutoSize
      - name: Add test notes
        run: |
          @'
          CONTROL FG RTX50 HDR STABLE WARMUP R35 TEST

          R35 is based on the R33 full-quality path. The R34 forced recomposition-slot rebuild has been removed.

          R34's failure log disproved the stale-slot theory:
          - all three destination recomposition slots were recreated after every live SDR/HDR switch;
          - the extreme ghosting still occurred and visual quality became worse.

          The repeatable timing problem is that Control's first two AA frames after every live HDR/SDR switch report Reset=1. R32/R33/R34 considered the domain settled after only three fresh frames, so the third frame was the first Reset=0 frame and FG was re-enabled immediately on the following Present.

          R35 keeps FG disabled for twelve fresh destination-domain AA/recomposition frames before rearm. This leaves roughly ten contiguous frames after Control's observed two reset frames for DLSS/DLSS-G/recomposition history to stabilize before interpolation resumes.

          Retained:
          - original HUDless + UI-alpha recomposition quality path;
          - user FG selection remains unchanged;
          - real slFreeResources(DLSS-G) hard teardown;
          - R33 opposite/unsettled transition refree protection;
          - no final-color-only fallback;
          - no forced recomposition-slot invalidation;
          - no gray shield;
          - no Win+Alt+B injection.

          Expected:
          FG_HDR_TRANSITION_GATE ... required_frames=12
          FG_HDR_TRANSITION_SETTLED ... fresh_frames=12
          HDR_BUTTON_FG_RESUMED

          Test repeated SDR <-> HDR switching at 2x and verify Jesse + HUD remain clean after both directions.
          '@ | Set-Content diagnostics/hdr-button-r20/package/HDR-BUTTON-R35-TEST.txt -Encoding UTF8
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: Control-FG-RTX50-HDR-Stable-Warmup-R35
          path: diagnostics/hdr-button-r20/package/
          retention-days: 7
          if-no-files-found: error
