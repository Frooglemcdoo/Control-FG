name: HDR Overlap Refree R33 Windows build
on:
  push:
    branches: ['diag/rtx50-hdr-overlap-refree-r33']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TsudaKageyu/minhook
          ref: v1.3.4
          path: diagnostics/hdr-button-r20/third_party/minhook
      - name: Prepare exact public v2 package
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://github.com/Frooglemcdoo/Control-FG/releases/download/v2.0.0/Control-FG-v2.0.0.zip' -OutFile baseline.zip
          python diagnostics/hdr-button-r20/tools/prepare.py baseline.zip diagnostics/hdr-button-r20/package
          if ($LASTEXITCODE -ne 0) { throw 'prepare failed' }
          python -m pip -q install pefile
          python -c "import pefile; p=pefile.PE('diagnostics/hdr-button-r20/package/dxgi.dll'); d={x.dll:[y.name for y in x.imports] for x in p.DIRECTORY_ENTRY_IMPORT}; print(d); assert b'ControlFGHDRButton_Bootstrap' in d[b'ControlFGHDRButton.dll']"
          if ($LASTEXITCODE -ne 0) { throw 'PE import validation failed' }
      - name: R33 architecture and lifecycle policy assertions
        run: |
          $ErrorActionPreference='Stop'
          $guard=Get-Content diagnostics/hdr-button-r20/src/guard.cpp -Raw
          $transition=Get-Content diagnostics/hdr-button-r20/src/transition.h -Raw
          foreach($forbidden in @('SendInput','WriteTransitionFgHold','shieldWindow','VK_LWIN','VK_LMENU','HookedUiRecomposeTag','R31_HDR_INPUT_PATH','R31A_HDR_INPUT_PATH','WriteFGSelectionRaw(0')) {
            if($guard.Contains($forbidden)) { throw "R33 forbidden mechanism remains: $forbidden" }
          }
          foreach($required in @('DisplayConfigSetDeviceInfo','beginHdrHardReset','originalBeginHdrHardReset','HookedBeginHdrHardReset','R33_OVERLAP_RESET_REBASE','R33_HARD_RESET_CONFIRMED','PatchThreeFrameTransitionWarmup','R33_TRANSITION_POLICY','R33_FG_REARM_WAIT','kRvaBridgeGeneration = 0xABD50','kRvaSettledBridgeGeneration = 0xABBF0','kRvaHdrHardResetResetBridgeGeneration = 0xABC58','failure_unwind_restore_saved_selection','HDR_BUTTON_FG_RESUMED')) {
            if(-not $guard.Contains($required)) { throw "R33 required lifecycle mechanism missing: $required" }
          }
          foreach($required in @('kTransitionTimeoutMs = 60000','kFreshDomainFramesRequired = 3','ThirtySecondStallIsSafe')) {
            if(-not $transition.Contains($required)) { throw "R33 transition contract missing: $required" }
          }
          @'
          import pefile
          p=pefile.PE('diagnostics/hdr-button-r20/package/dxgi.dll')
          image=bytes(p.__data__)
          checks={
              0x0CDC0: bytes.fromhex('48 89 6C 24 20 56 48 83 EC 30'),
              0x414B4: bytes.fromhex('83 F9 02'),
              0x41513: bytes.fromhex('C7 44 24 20 02 00 00 00'),
              0x41569: bytes.fromhex('41 83 FE 02'),
              0x4169B: bytes.fromhex('83 F9 02'),
              0x41742: bytes.fromhex('41 83 FF 02'),
          }
          for rva,expected in checks.items():
              off=p.get_offset_from_rva(rva)
              actual=image[off:off+len(expected)]
              assert actual==expected,(hex(rva),actual.hex(),expected.hex())
          print('PASS R33 hard-reset and three-frame patch signatures')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'R33 binary signature validation failed' }
          Write-Host 'PASS R33 policy: full recomposition preserved; each opposite unsettled display transition starts a new hard-reset serial and re-frees DLSS-G resources.'
      - name: Compile MSVC Release
        run: |
          cmake -S diagnostics/hdr-button-r20 -B diagnostics/hdr-button-r20/build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          cmake --build diagnostics/hdr-button-r20/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
      - name: Unit and loader tests
        run: |
          ctest --test-dir diagnostics/hdr-button-r20/build -C Release --output-on-failure --verbose
          if ($LASTEXITCODE -ne 0) { throw 'ctest failed' }
      - name: Assemble and smoke-test package
        run: |
          $ErrorActionPreference='Stop'
          $root='diagnostics/hdr-button-r20'
          Copy-Item "$root/build/Release/ControlFGHDRButton.dll" "$root/package/ControlFGHDRButton.dll"
          Copy-Item "$root/third_party/minhook/LICENSE.txt" "$root/package/legal/MINHOOK-LICENSE.txt"
          & "$root/build/Release/core_load_test.exe" (Resolve-Path "$root/package/dxgi.dll").Path
          if ($LASTEXITCODE -ne 0) { throw 'core/helper hook smoke test failed' }
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "$root/package/Collect-ControlFG-Compact-Logs.ps1").Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; throw 'collector syntax failure' }
          Get-FileHash "$root/package/dxgi.dll","$root/package/ControlFGHDRButton.dll" -Algorithm SHA256 | Format-Table -AutoSize
      - name: Add test notes
        run: |
          @'
          CONTROL FG RTX50 HDR OVERLAP REFREE R33 TEST

          R33 keeps the original full-quality HUDless + UI-alpha recomposition path from R32.

          The R32 failure log showed one abnormal transition:
          - the render/AA path stopped for 1,084 Presents;
          - the display crossed HDR generation 5 -> 6 -> 7 while hard-reset serial 4 remained active;
          - DLSS-G resources were freed only at generation 5;
          - generation 7 later re-armed from that old reset and the extreme ghosting returned.

          R33 adds one lifecycle rule:
          if an opposite SDR/HDR transition begins while the prior hard reset is still stage 2 and its display generation has not settled, R33 resets that completed reset to stage 0 before the core handles the new resize. The core then starts a NEW hard-reset serial and performs a NEW slFreeResources(DLSS-G) on the Present/resize path.

          This means a reset is no longer allowed to span multiple display-domain switches.

          R32 behavior retained:
          - user FG selection stays unchanged;
          - real DLSS-G hard free before domain change;
          - full HDR/SDR recomposition;
          - three fresh recomposition frames before rearm;
          - no final-color-only fallback;
          - no gray shield;
          - no Win+Alt+B injection.

          On an overlapping recovery, expect:
          R33_OVERLAP_RESET_REBASE
          FG_HDR_HARD_RESET_BEGIN ... serial=<new serial>
          FG_HDR_HARD_RESET_FREE ... frees=<incremented>
          FG_HDR_TRANSITION_SETTLED ... fresh_frames=3
          HDR_BUTTON_FG_RESUMED

          Test repeated SDR <-> HDR switching at 2x, including at least 5 HDR re-enables.
          '@ | Set-Content diagnostics/hdr-button-r20/package/HDR-BUTTON-R33-TEST.txt -Encoding UTF8
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: Control-FG-RTX50-HDR-Overlap-Refree-R33
          path: diagnostics/hdr-button-r20/package/
          retention-days: 7
          if-no-files-found: error
