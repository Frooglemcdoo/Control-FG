name: Package v2.1.2 candidate source

on:
  push:
    branches:
      - release/v2.1.2-candidate
    paths:
      - ".github/workflows/package-v2.1.2-candidate-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Preserve repository bytes
        shell: powershell
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh v2.1.2 source evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = '5f04832d19d9f9be8c447997281e14c123806206'
          $checkpointPath = 'validation/current-release/results.json'
          $manifestPath = 'SOURCE-SHA256.json'
          $tempWorkflow = '.github/workflows/package-v2.1.2-candidate-source.yml'

          $changed = @(git diff --name-only $baseline HEAD) |
            Where-Object { $_ -and $_ -ne $checkpointPath -and $_ -ne $manifestPath -and $_ -ne $tempWorkflow }

          $checkpoint = Get-Content -LiteralPath $checkpointPath -Raw | ConvertFrom-Json
          $checkpoint.candidate = '2.1.2'
          $checkpoint.scope = 'v2.1.2 release candidate: RR VRAM lifecycle fixes, Experimental Texture Streaming, optional VRAM monitor, RTX 40-series NVIDIA 617.14 / DLSS-G 310.9.1 compatibility, and updated RR attribution.'
          foreach ($rel in $changed) {
            if (-not (Test-Path -LiteralPath $rel -PathType Leaf)) { continue }
            $hash = (Get-FileHash -LiteralPath $rel -Algorithm SHA256).Hash.ToLowerInvariant()
            $prop = $checkpoint.tested_sha256.PSObject.Properties[$rel]
            if ($null -eq $prop) {
              $checkpoint.tested_sha256 | Add-Member -NotePropertyName $rel -NotePropertyValue $hash
            } else {
              $prop.Value = $hash
            }
          }
          $checkpoint | ConvertTo-Json -Depth 40 | Set-Content -LiteralPath $checkpointPath -Encoding UTF8

          $manifest = [ordered]@{}
          foreach ($rel in (git ls-files)) {
            if ($rel -eq $manifestPath -or $rel -eq $tempWorkflow) { continue }
            if (-not (Test-Path -LiteralPath $rel -PathType Leaf)) { continue }
            $manifest[$rel] = (Get-FileHash -LiteralPath $rel -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $manifestPath -Encoding UTF8

      - name: Build and validate v2.1.2 source
        shell: cmd
        run: echo.|Build.cmd

      - name: Stage buildable source ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'v212-source-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $exclude = @(
            '.github/workflows/package-v2.1.2-candidate-source.yml'
          )
          foreach ($rel in (git ls-files)) {
            if ($exclude -contains $rel) { continue }
            $src = Join-Path $PWD $rel
            if (-not (Test-Path -LiteralPath $src -PathType Leaf)) { continue }
            $dst = Join-Path $stage $rel
            $parent = Split-Path -Parent $dst
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -LiteralPath $src -Destination $dst
          }
          # Use refreshed working-tree evidence rather than the stale committed copies.
          Copy-Item -LiteralPath 'validation/current-release/results.json' -Destination (Join-Path $stage 'validation/current-release/results.json') -Force
          Copy-Item -LiteralPath 'SOURCE-SHA256.json' -Destination (Join-Path $stage 'SOURCE-SHA256.json') -Force

          $zip = Join-Path $PWD 'Control-FG-v2.1.2-Source-Candidate.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath 'Control-FG-v2.1.2-Source-Candidate.sha256' -Encoding ASCII

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: Control-FG-v2.1.2-Source-Candidate
          path: |
            Control-FG-v2.1.2-Source-Candidate.zip
            Control-FG-v2.1.2-Source-Candidate.sha256
            build/build-validation.json
            build/deployment-validation.json
            Build.log
          if-no-files-found: error
          retention-days: 7
