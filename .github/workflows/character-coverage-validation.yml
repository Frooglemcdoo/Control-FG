name: Character coverage candidate validation
on:
  push:
    branches: [work/character-coverage-validation-r419]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install numerical test dependency
        run: python -m pip install numpy
      - name: Execute native remap and candidate guard tests
        shell: cmd
        run: |
          python tools/test-character-native-remap.py
          if errorlevel 1 exit /b 1
          python tools/test-character-coverage-guard.py
          if errorlevel 1 exit /b 1
          python tools/test-character-diffuse-impulses.py
          if errorlevel 1 exit /b 1
      - name: Dispatch coverage guard and verify GPU readbacks
        shell: cmd
        run: |
          python tools/character_surface.py
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 tools\test-character-diffuse-gpu.cpp /Febuild\test-character-diffuse-gpu.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\test-character-diffuse-gpu.exe --compile
          if errorlevel 1 exit /b 1
          python tools/test-character-diffuse.py --gpu-fixture
          if errorlevel 1 exit /b 1
          python tools/prepare-character-coverage-gpu.py
          if errorlevel 1 exit /b 1
          build\test-character-diffuse-gpu.exe
          if errorlevel 1 exit /b 1
      - name: Generate isolated candidate shader set
        run: python tools/prepare-character-coverage-validation.py
      - name: Validate candidate graphics pipelines on WARP
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 tools\test-character-surface-gpu.cpp /Febuild\test-character-surface-gpu.exe /link d3d12.lib dxgi.lib d3dcompiler.lib
          if errorlevel 1 exit /b 1
          build\test-character-surface-gpu.exe
          if errorlevel 1 exit /b 1
